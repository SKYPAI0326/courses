<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作室待處理清單</title>
  <meta name="description" content="工作室任務示範：查看詳情、取消或確認完成，並檢查已完成狀態。">
  <meta property="og:title" content="工作室待處理清單">
  <meta property="og:description" content="查看、確認與完成工作室任務的示範網站。">
  <meta property="og:url" content="https://skypai0326.github.io/courses/courses/uiux-designer/web-starter/">
  <meta property="og:image" content="https://skypai0326.github.io/courses/素材/og-default.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="工作室待處理清單">
  <meta name="twitter:description" content="工作室任務與確認示範網站。">
  <link rel="canonical" href="https://skypai0326.github.io/courses/courses/uiux-designer/web-starter/">
  <style>.skip-link{position:absolute;left:-9999px}.skip-link:focus-visible{left:12px;top:12px;z-index:10;background:white;padding:12px}</style>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<style id="_gs">
#_gate{position:fixed;inset:0;z-index:9999;background:#f5f3ee;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',sans-serif}
#_gate-box{width:100%;max-width:340px;padding:48px 36px;background:#fff;border:1px solid #d8d4cb;border-radius:6px;text-align:center}
#_gate-title{font-family:'Noto Serif TC',serif;font-size:1.45rem;font-weight:700;color:#2c2b28;margin-bottom:8px}
#_gate-sub{font-size:.8rem;color:#8c8880;margin-bottom:28px;line-height:1.7}
#_gate-input{width:100%;padding:10px 14px;border:1px solid #d8d4cb;border-radius:6px;font-size:.95rem;font-family:inherit;background:#f5f3ee;color:#2c2b28;outline:none;text-align:center;letter-spacing:.15em;box-sizing:border-box}
#_gate-input:focus{border-color:#6b7fa3;background:#fff}
#_gate-btn{margin-top:12px;width:100%;padding:11px;background:#6b7fa3;color:#fff;border:none;border-radius:6px;font-size:.85rem;font-family:inherit;cursor:pointer;transition:background .2s}
#_gate-btn:hover{background:#5c6f91}
#_gate-err{font-size:.75rem;color:#b5703a;margin-top:10px;min-height:16px}
</style>
<div id="_gate">
  <div id="_gate-box">
    <div id="_gate-title">弄一下工作室</div>
    <div id="_gate-sub">課程專屬講義<br>請輸入課程密碼</div>
    <input id="_gate-input" type="password" placeholder="••••••••" autocomplete="off">
    <button id="_gate-btn" onclick="_gc()">進入課程</button>
    <div id="_gate-err"></div>
  </div>
</div>
<script>
(function(){const K='uiux_auth',H='df0e9e450c9c887ecd486a45a676911404cf86518b0589ef6ad3b0537a86a95a';if(localStorage.getItem(K)==='1')sessionStorage.setItem(K,'1');if(sessionStorage.getItem(K)==='1'){var g=document.getElementById('_gate');if(g)g.style.display='none';return}async function _gc(){var v=document.getElementById('_gate-input').value,buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex===H){sessionStorage.setItem(K,'1');document.getElementById('_gate').style.display='none'}else{document.getElementById('_gate-err').textContent='密碼錯誤，請再試一次'}}window._gc=_gc;document.getElementById('_gate-input').addEventListener('keydown',function(e){if(e.key==='Enter')_gc()})})()</script>

  <a href="#main" class="skip-link">跳至主要內容</a>
  <header class="app-header"><h1>工作室任務</h1></header>
  <main id="main">
    <section id="login-screen">
      <h2>登入工作室</h2>
      <p>用示範帳號查看任務；重新整理後會回到預設資料。</p>
      <label>工作室帳號<input value="studio@example.test" readonly></label>
      <label>密碼<input type="password" value="demo-only" readonly></label>
      <button id="login-button" type="button">登入</button>
    </section>
    <section id="list-screen" hidden>
      <h2 id="list-title">待處理清單</h2>
      <div id="task-list" class="task-list"></div>
      <p id="empty-message" hidden>目前沒有這個狀態的任務。</p>
    </section>
    <section id="detail-screen" hidden>
      <button id="back-button" class="secondary" type="button">← 返回清單</button>
      <h2 id="detail-title"></h2>
      <p id="detail-due" class="muted"></p>
      <p>核對內容、期限與交付檔名後，再標記完成。</p>
      <button id="complete-task" type="button">標記完成</button>
    </section>
    <p id="feedback" class="toast" role="status" aria-live="polite"></p>
  </main>
  <nav id="bottom-nav" aria-label="任務狀態" hidden>
    <button id="pending-tab" aria-current="page" type="button">待處理</button>
    <button id="done-tab" type="button">已完成</button>
  </nav>
  <button id="scroll-top" class="floating" type="button" aria-label="回到清單頂部" hidden>↑</button>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">確認完成？</h2>
    <p>這筆任務將移到已完成清單。</p>
    <div class="actions">
      <button id="cancel-button" class="secondary" type="button">取消</button>
      <button id="confirm-button" type="button">確認完成</button>
    </div>
  </dialog>
</body>
</html>
