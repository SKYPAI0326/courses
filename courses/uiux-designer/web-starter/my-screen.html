<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的題目清單</title>
  <meta name="description" content="把自己在 Figma 設計的清單畫面做成網頁的練習範本。">
  <meta property="og:title" content="我的題目清單">
  <meta property="og:description" content="把 Figma 設計的清單畫面做成網頁。">
  <meta property="og:url" content="https://skypai0326.github.io/courses/courses/uiux-designer/web-starter/my-screen.html">
  <meta property="og:image" content="https://skypai0326.github.io/courses/素材/og-default.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="我的題目清單">
  <meta name="twitter:description" content="把 Figma 設計的清單畫面做成網頁。">
  <link rel="canonical" href="https://skypai0326.github.io/courses/courses/uiux-designer/web-starter/my-screen.html">
  <style>
    /* 第一步：把下面的值換成你在 Figma Variables 建的顏色與間距 */
    :root {
      --primary: #245B45;
      --primary-pressed: #1B4535;
      --text: #1E293B;
      --muted: #5F6C80;
      --surface: #F5F7FA;
      --card: #FFFFFF;
      --border: #CBD5E1;
      --focus-ring: #1E293B;
      --space-8: 8px;
      --space-16: 16px;
      --space-24: 24px;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 16px; line-height: 24px; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus-visible { left: 12px; top: 12px; background: var(--card); padding: 12px; }
    main { max-width: 360px; margin: 0 auto; padding: var(--space-24) var(--space-16); }
    h1 { font-size: 24px; line-height: 32px; margin: 0 0 var(--space-16); }
    /* 第二步：卡片的內距、間距、圓角照你的規格表調整 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-16); margin-bottom: var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); }
    .card h2 { font-size: 18px; line-height: 28px; margin: 0; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 22px; }
    .status { align-self: flex-start; font-size: 14px; line-height: 22px; padding: 2px var(--space-8); border-radius: var(--radius); background: var(--surface); }
    button { min-height: 48px; padding: 12px var(--space-16); font: inherit; font-weight: 500; color: var(--card); background: var(--primary); border: 0; border-radius: var(--radius); cursor: pointer; }
    button:active { background: var(--primary-pressed); }
    button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: 1; background: #E2E8F0; color: #526075; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">跳至主要內容</a>
  <main id="main">
    <h1>我的題目清單</h1>
    <!-- 第三步：把三張卡片的文字換成你題目 CSV 的三筆資料；不能選的那筆讓按鈕加上 disabled -->
    <article class="card">
      <h2>第一筆名稱</h2>
      <p>一句說明</p>
      <span class="status">狀態</span>
      <button type="button">主要動作</button>
    </article>
    <article class="card">
      <h2>第二筆名稱</h2>
      <p>一句說明</p>
      <span class="status">狀態</span>
      <button type="button">主要動作</button>
    </article>
    <article class="card">
      <h2>第三筆名稱</h2>
      <p>一句說明</p>
      <span class="status">不能選的狀態</span>
      <button type="button" disabled>主要動作</button>
    </article>
  </main>
</body>
</html>
