  <style>
    /* 第一步：把下面的值換成你在 Figma Variables 建的顏色與間距 */
    :root {
      --primary: #245B45;
      --primary-pressed: #1B4535;
      --text: #1E293B;
      --muted: #5F6C80;
      --surface: #F5F7FA;
      --card: #FFFFFF;
      --border: #CBD5E1;
      --focus-ring: #1E293B;
      --space-8: 8px;
      --space-16: 16px;
      --space-24: 24px;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 16px; line-height: 24px; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus-visible { left: 12px; top: 12px; background: var(--card); padding: 12px; }
    main { max-width: 360px; margin: 0 auto; padding: var(--space-24) var(--space-16); }
    h1 { font-size: 24px; line-height: 32px; margin: 0 0 var(--space-16); }
    /* 第二步：卡片的內距、間距、圓角照你的規格表調整 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-16); margin-bottom: var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); }
    .card h2 { font-size: 18px; line-height: 28px; margin: 0; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 22px; }
    .status { align-self: flex-start; font-size: 14px; line-height: 22px; padding: 2px var(--space-8); border-radius: var(--radius); background: var(--surface); }
    button { min-height: 48px; padding: 12px var(--space-16); font: inherit; font-weight: 500; color: var(--card); background: var(--primary); border: 0; border-radius: var(--radius); cursor: pointer; }
    button:active { background: var(--primary-pressed); }
    button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: 1; background: #E2E8F0; color: #526075; }
  </style>
</head>
<body>
<style id="_gs">
#_gate{position:fixed;inset:0;z-index:9999;background:#f5f3ee;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',sans-serif}
#_gate-box{width:100%;max-width:340px;padding:48px 36px;background:#fff;border:1px solid #d8d4cb;border-radius:6px;text-align:center}
#_gate-title{font-family:'Noto Serif TC',serif;font-size:1.45rem;font-weight:700;color:#2c2b28;margin-bottom:8px}
#_gate-sub{font-size:.8rem;color:#8c8880;margin-bottom:28px;line-height:1.7}
#_gate-input{width:100%;padding:10px 14px;border:1px solid #d8d4cb;border-radius:6px;font-size:.95rem;font-family:inherit;background:#f5f3ee;color:#2c2b28;outline:none;text-align:center;letter-spacing:.15em;box-sizing:border-box}
#_gate-input:focus{border-color:#6b7fa3;background:#fff}
#_gate-btn{margin-top:12px;width:100%;padding:11px;background:#6b7fa3;color:#fff;border:none;border-radius:6px;font-size:.85rem;font-family:inherit;cursor:pointer;transition:background .2s}
#_gate-btn:hover{background:#5c6f91}
#_gate-err{font-size:.75rem;color:#b5703a;margin-top:10px;min-height:16px}
</style>
<div id="_gate">
  <div id="_gate-box">
    <div id="_gate-title">弄一下工作室</div>
    <div id="_gate-sub">課程專屬講義<br>請輸入課程密碼</div>
    <input id="_gate-input" type="password" placeholder="••••••••" autocomplete="off">
    <button id="_gate-btn" onclick="_gc()">進入課程</button>
    <div id="_gate-err"></div>
  </div>
</div>
<script>
(function(){const K='uiux_auth',H='b237df7188aa69d1b92aa59a225ff85c60c7c1616292dcef3a4bd23fd1700bc8';if(localStorage.getItem(K)==='1')sessionStorage.setItem(K,'1');if(sessionStorage.getItem(K)==='1'){var g=document.getElementById('_gate');if(g)g.style.display='none';return}async function _gc(){var v=document.getElementById('_gate-input').value,buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex===H){sessionStorage.setItem(K,'1');document.getElementById('_gate').style.display='none'}else{document.getElementById('_gate-err').textContent='密碼錯誤，請再試一次'}}window._gc=_gc;document.getElementById('_gate-input').addEventListener('keydown',function(e){if(e.key==='Enter')_gc()})})()</script>

  <a href="#main" class="skip-link">跳至主要內容</a>
  <main id="main">
    <h1>我的題目清單</h1>
    <!-- 第三步：把三張卡片的文字換成你題目 CSV 的三筆資料；不能選的那筆讓按鈕加上 disabled -->
    <article class="card">
      <h2>第一筆名稱</h2>
      <p>一句說明</p>
      <span class="status">狀態</span>
      <button type="button">主要動作</button>
    </article>
    <article class="card">
      <h2>第二筆名稱</h2>
      <p>一句說明</p>
      <span class="status">狀態</span>
      <button type="button">主要動作</button>
    </article>
    <article class="card">
      <h2>第三筆名稱</h2>
      <p>一句說明</p>
      <span class="status">不能選的狀態</span>
      <button type="button" disabled>主要動作</button>
    </article>
  </main>
</body>
</html>
