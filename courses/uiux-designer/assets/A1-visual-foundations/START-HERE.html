<body><main><h1>視覺基礎：起始材料</h1><p>這一堂會建立一頁 Figma 視覺規則表，讓後面的手機畫面使用同一套色彩與文字層級。</p><h2>案例文字</h2><table><tr><th>用途</th><th>文字</th></tr><tr><td>頁面標題</td><td>登入工作區</td></tr><tr><td>說明</td><td>輸入帳號與密碼後開始工作</td></tr><tr><td>錯誤訊息</td><td>密碼至少需要包含一個英文大寫字母與一個數字</td></tr><tr><td>按鈕</td><td>開始登入</td></tr></table><h2>本例基準值</h2><ul><li>背景色：<code>#F5F3EE</code></li><li>主要文字：<code>#2C2B28</code></li><li>強調色：<code>#C9963A</code></li><li>文字級距：14、16、24、32 px</li></ul><p>完成後回到<a href="../../part1/CH1-visual-foundations.html">視覺基礎學習頁</a>，依照示範建立自己的 Figma 檔。</p></main></body></html>
