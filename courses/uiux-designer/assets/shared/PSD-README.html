<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSD素材與透明PNG｜UI/UX課程</title><link rel="stylesheet" href="../asset-start.css"><style>main{max-width:780px;margin:auto;padding:32px 24px}.preview{background:#DEE7EF;padding:20px}img{max-width:100%;width:256px}</style></head><body><main><h1>status-badge.psd：可分別切換的三個圖層</h1><p>這是課程製作的512×512 RGB點陣素材。Background圖層是白底，預設隱藏；Card圖層是綠色圓角底；Check圖層是白色勾號。此素材不是Figma畫面，也不是可編輯文字圖層。</p><p><a href="status-badge.psd" download>下載分層PSD</a> · <a href="status-badge.png" download>下載透明PNG參考</a></p><div class="preview"><img src="status-badge.png" alt="透明角落顯示後方灰底的綠色完成徽章"></div><p>在Photoshop開啟PSD時，應能分別切換Background與Check圖層的眼睛圖示；隱藏Background後，於Export As選擇PNG與Transparency，輸出512×512檔案。四角需維持透明，不能用白底JPG代替。</p><p><a href="../../part2/CH7-figma-handoff-export.html" target="_blank" rel="noopener noreferrer">回第15堂操作步驟</a></p></main></body></html>
