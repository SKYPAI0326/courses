<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字對比檢查器｜UI/UX課程</title><link rel="stylesheet" href="../asset-start.css"><style>main{max-width:700px;margin:auto;padding:32px 24px}label{display:block;margin:16px 0}input{font:inherit;padding:10px;max-width:100%}.sample{padding:24px;margin:20px 0;border:1px solid #CBD5E1}button{font:inherit;padding:10px 16px;background:#245B45;color:white;border:0;border-radius:4px}</style></head><body><main><h1>文字對比檢查器</h1><p>輸入前景文字與背景色碼，讀取比值。一般文字以4.5:1為基準；大字以3:1為基準。大字條件為至少24px的一般字，或至少約18.7px的粗體；按鈕16px仍以4.5判斷。</p><label>文字色碼<input id="foreground" value="#FFFFFF" maxlength="7"></label><label>背景色碼<input id="background" value="#245B45" maxlength="7"></label><button id="calculate" type="button">計算對比</button><p id="result" role="status"></p><div class="sample" id="sample">登入工作室／一般文字16px</div><p><a href="../../part1/CH1-visual-foundations.html">回第01堂色彩與字型</a> · <a href="https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html">W3C計算基準</a></p></main><script>
const foreground=document.querySelector('#foreground'),background=document.querySelector('#background');
function luminance(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;}
function calculate(){const fg=foreground.value.trim(),bg=background.value.trim();const output=document.querySelector('#result');if(!/^#[0-9a-f]{6}$/i.test(fg)||!/^#[0-9a-f]{6}$/i.test(bg)){output.textContent='請輸入完整六位色碼，例如#245B45。';return;}const values=[luminance(fg),luminance(bg)].sort((a,b)=>a-b);const ratio=(values[1]+.05)/(values[0]+.05);output.textContent=`對比 ${ratio.toFixed(2)}:1；一般文字${ratio>=4.5?'達4.5基準':'未達4.5基準'}；大字${ratio>=3?'達3基準':'未達3基準'}。`;const sample=document.querySelector('#sample');sample.style.color=fg;sample.style.backgroundColor=bg;}
document.querySelector('#calculate').addEventListener('click',calculate);calculate();
</script></body></html>
