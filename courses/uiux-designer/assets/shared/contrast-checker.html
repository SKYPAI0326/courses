<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字對比檢查器｜UI/UX課程</title><link rel="stylesheet" href="../asset-start.css"><style>main{max-width:700px;margin:auto;padding:32px 24px}label{display:block;margin:16px 0}input{font:inherit;padding:10px;max-width:100%}.sample{padding:24px;margin:20px 0;border:1px solid #DEE7EF}button{font:inherit;padding:10px 16px;background:#167D8D;color:white;border:0;border-radius:4px}</style></head><body>
<style id="_gs">
#_gate{position:fixed;inset:0;z-index:9999;background:#f5f3ee;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',sans-serif}
#_gate-box{width:100%;max-width:340px;padding:48px 36px;background:#fff;border:1px solid #d8d4cb;border-radius:6px;text-align:center}
#_gate-title{font-family:'Noto Serif TC',serif;font-size:1.45rem;font-weight:700;color:#2c2b28;margin-bottom:8px}
#_gate-sub{font-size:.8rem;color:#8c8880;margin-bottom:28px;line-height:1.7}
#_gate-input{width:100%;padding:10px 14px;border:1px solid #d8d4cb;border-radius:6px;font-size:.95rem;font-family:inherit;background:#f5f3ee;color:#2c2b28;outline:none;text-align:center;letter-spacing:.15em;box-sizing:border-box}
#_gate-input:focus{border-color:#6b7fa3;background:#fff}
#_gate-btn{margin-top:12px;width:100%;padding:11px;background:#6b7fa3;color:#fff;border:none;border-radius:6px;font-size:.85rem;font-family:inherit;cursor:pointer;transition:background .2s}
#_gate-btn:hover{background:#5c6f91}
#_gate-err{font-size:.75rem;color:#b5703a;margin-top:10px;min-height:16px}
</style>
<div id="_gate">
  <div id="_gate-box">
    <div id="_gate-title">弄一下工作室</div>
    <div id="_gate-sub">課程專屬講義<br>請輸入課程密碼</div>
    <input id="_gate-input" type="password" placeholder="••••••••" autocomplete="off">
    <button id="_gate-btn" onclick="_gc()">進入課程</button>
    <div id="_gate-err"></div>
  </div>
</div>
<script>
(function(){const K='uiux_auth',H='df0e9e450c9c887ecd486a45a676911404cf86518b0589ef6ad3b0537a86a95a';if(localStorage.getItem(K)==='1')sessionStorage.setItem(K,'1');if(sessionStorage.getItem(K)==='1'){var g=document.getElementById('_gate');if(g)g.style.display='none';return}async function _gc(){var v=document.getElementById('_gate-input').value,buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex===H){sessionStorage.setItem(K,'1');document.getElementById('_gate').style.display='none'}else{document.getElementById('_gate-err').textContent='密碼錯誤，請再試一次'}}window._gc=_gc;document.getElementById('_gate-input').addEventListener('keydown',function(e){if(e.key==='Enter')_gc()})})()</script>
<main><h1>文字對比檢查器</h1><p>輸入前景文字與背景色碼，讀取比值。一般文字以4.5:1為基準；大字以3:1為基準。大字條件為至少24px的一般字，或至少約18.7px的粗體；按鈕16px仍以4.5判斷。</p><label>文字色碼<input id="foreground" value="#FFFFFF" maxlength="7"></label><label>背景色碼<input id="background" value="#245B45" maxlength="7"></label><button id="calculate" type="button">計算對比</button><p id="result" role="status"></p><div class="sample" id="sample">登入工作室／一般文字16px</div><p><a href="../../index.html#overview" target="_blank" rel="noopener noreferrer">回課程總目錄</a> · <a href="https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html" target="_blank" rel="noopener noreferrer">W3C計算基準</a></p></main><script>
const foreground=document.querySelector('#foreground'),background=document.querySelector('#background');
function luminance(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;}
function calculate(){const fg=foreground.value.trim(),bg=background.value.trim();const output=document.querySelector('#result');if(!/^#[0-9a-f]{6}$/i.test(fg)||!/^#[0-9a-f]{6}$/i.test(bg)){output.textContent='請輸入完整六位色碼，例如#245B45。';return;}const values=[luminance(fg),luminance(bg)].sort((a,b)=>a-b);const ratio=(values[1]+.05)/(values[0]+.05);output.textContent=`對比 ${ratio.toFixed(2)}:1；一般文字${ratio>=4.5?'達4.5基準':'未達4.5基準'}；大字${ratio>=3?'達3基準':'未達3基準'}。`;const sample=document.querySelector('#sample');sample.style.color=fg;sample.style.backgroundColor=bg;}
document.querySelector('#calculate').addEventListener('click',calculate);calculate();
</script></body></html>
