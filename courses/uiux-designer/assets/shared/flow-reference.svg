<svg xmlns="http://www.w3.org/2000/svg" width="750" height="355" viewBox="0 0 750 355" role="img"><style>text{font-family:Arial,"Noto Sans TC","PingFang TC",sans-serif;fill:#1E293B}.muted{fill:#5F6C80}.white{fill:white}</style><rect width="100%" height="100%" fill="#F5F7FA"/><text x="22" y="32" font-size="20" class="">同一個檔案完成任務；每個連線是一個基本互動</text><rect x="22" y="65" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="42" y="107" font-size="20" class="">登入</text><rect x="252" y="65" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="272" y="107" font-size="20" class="">清單</text><rect x="482" y="65" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="502" y="107" font-size="20" class="">詳情</text><rect x="22" y="210" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="42" y="252" font-size="20" class="">確認Dialog</text><rect x="252" y="210" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="272" y="252" font-size="20" class="">完成提示</text><rect x="482" y="210" width="200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="502" y="252" font-size="20" class="">清單已完成</text><text x="38" y="176" font-size="15" class="">登入→清單→詳情</text><text x="260" y="176" font-size="15" class="">詳情→開啟Dialog</text><text x="475" y="176" font-size="15" class="">取消：關閉Overlay</text><text x="28" y="327" font-size="15" class="">確認：關閉／完成提示→清單已完成；不用真實帳密或資料庫。</text></svg>