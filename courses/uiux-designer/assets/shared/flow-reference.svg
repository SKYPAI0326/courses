<svg xmlns="http://www.w3.org/2000/svg" width="930" height="370" viewBox="0 0 930 370" role="img" aria-label="完成一筆任務的流程示意圖：登入、待處理清單、任務詳情、確認、完成清單由左到右，箭頭旁寫觸發動作；登入下方有登入失敗提示，再連回登入"><style>text{font-family:Arial,"Noto Sans TC","PingFang TC",sans-serif;fill:#1E293B}.muted{fill:#5F6C80}.node{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.5}.err{fill:#FFF7ED;stroke:#C2410C;stroke-width:1.5}.line{stroke:#334155;stroke-width:2;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#F5F7FA"/><text x="20" y="38" font-size="19">流程圖示意：完成一筆任務（主要路徑＋登入失敗分支）</text><rect class="node" x="20" y="70" width="112" height="64" rx="8"/><text x="76" y="108" font-size="18" text-anchor="middle">登入</text><rect class="node" x="214" y="70" width="112" height="64" rx="8"/><text x="270" y="108" font-size="18" text-anchor="middle">待處理清單</text><rect class="node" x="408" y="70" width="112" height="64" rx="8"/><text x="464" y="108" font-size="18" text-anchor="middle">任務詳情</text><rect class="node" x="602" y="70" width="112" height="64" rx="8"/><text x="658" y="108" font-size="18" text-anchor="middle">確認</text><rect class="node" x="796" y="70" width="112" height="64" rx="8"/><text x="852" y="108" font-size="18" text-anchor="middle">完成清單</text><line class="line" x1="136" y1="120" x2="210" y2="120" marker-end="url(#arrow)"/><text x="173" y="111" font-size="15" text-anchor="middle">登入成功</text><line class="line" x1="330" y1="120" x2="404" y2="120" marker-end="url(#arrow)"/><text x="367" y="93" font-size="15" text-anchor="middle">選擇</text><text x="367" y="111" font-size="15" text-anchor="middle">整理交付包</text><line class="line" x1="524" y1="120" x2="598" y2="120" marker-end="url(#arrow)"/><text x="561" y="111" font-size="15" text-anchor="middle">標記完成</text><line class="line" x1="718" y1="120" x2="792" y2="120" marker-end="url(#arrow)"/><text x="755" y="111" font-size="15" text-anchor="middle">確認完成</text><rect class="err" x="20" y="238" width="170" height="60" rx="8"/><text x="105" y="274" font-size="18" text-anchor="middle">登入失敗提示</text><line class="line" x1="44" y1="138" x2="44" y2="234" marker-end="url(#arrow)"/><text x="52" y="184" font-size="15">登入</text><text x="52" y="202" font-size="15">失敗</text><line class="line" x1="124" y1="238" x2="124" y2="142" marker-end="url(#arrow)"/><text x="132" y="196" font-size="15">修正資料後重試</text><text x="20" y="342" font-size="14" class="muted">上排是主要路徑，下方是錯誤分支；箭頭旁的字是觸發換頁的動作。示意圖，不是 Figma 截圖。</text></svg>
