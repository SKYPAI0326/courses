<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B6 任務測試起始頁</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.8;background:#f5f3ee;color:#2c2b28}main{background:white;padding:28px;border:1px solid #d8d4cb;border-radius:4px}code{background:#edeae3;padding:2px 5px}</style></head><body><main><h1>B6 Prototype 任務測試</h1><p>接手 B4 的兩個 Frame 與一條核心 action。先記錄，再修正。</p><ol><li>確認 Preview 從 <code>Screen / Host</code> 開始。</li><li>任務：點擊 Host 一次，預期看到 <code>確認完成</code>。</li><li>把 Actual 與 Expected 分開記錄。</li><li>一次只改一個主要變因，重跑同一任務。</li></ol><p>Starter 第二個 action 的提示是平台限制，標記 <code>CONDITIONAL</code> 並拆檔，不要按 Upgrade。</p><p><a href="reference/TASK-TEST-FORM.html">開啟測試表 →</a></p></main></body></html>
