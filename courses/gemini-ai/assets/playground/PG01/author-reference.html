<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV 清理與品質檢查｜作者參考工具</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17212b;background:#f4f7f8;line-height:1.55}*{box-sizing:border-box}body{margin:0}header{background:#123449;color:#fff;padding:24px max(20px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:1.7rem}header p{margin:6px 0 0;color:#d9e7ec}.wrap{max-width:1100px;margin:auto;padding:20px}.notice{background:#fff7df;border:1px solid #ebd084;border-radius:6px;padding:14px;margin-bottom:16px}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:6px;padding:18px;margin:14px 0;}.panel h2{font-size:1.16rem;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-weight:650;font-size:.92rem}.field input,.field select,.field textarea,input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{font:inherit;padding:8px 9px;border:1px solid #b7c6ce;border-radius:7px;background:#fff;color:#17212b}.field select[multiple]{min-height:100px}.field small,.hint{font-size:.83rem;color:#53616a}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.buttons button,button{font:inherit;border:0;border-radius:7px;padding:8px 12px;background:#0b6a78;color:#fff;cursor:pointer}.buttons button.secondary,button.secondary{background:#e4edf0;color:#16323e}.buttons button.danger{background:#9b3e39}.status{min-height:1.5em;padding:4px 2px;color:#155b46}.status.error{color:#9b3028}.status.warn{color:#855a0c}.scroll{overflow:auto;max-height:360px;border:1px solid #dce4e7;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid #e5ecef;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#edf3f5;z-index:1}td input{min-width:92px;width:100%;font:inherit;padding:5px;border:1px solid #c9d4d9;border-radius:5px}.pill{display:inline-block;border-radius:99px;background:#eaf1f4;padding:2px 9px;margin:2px}.result{white-space:pre-wrap;background:#f7fafb;border:1px solid #dce5e8;border-radius:8px;padding:12px;min-height:60px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.small{font-size:.86rem;color:#53616a}.rule-row{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr)) auto;gap:6px;margin:7px 0}.svgbox{width:100%;overflow:auto}.svgbox svg{display:block;max-width:100%;height:auto}.checkline{display:flex;align-items:center;gap:8px;padding:7px 0}.checkline input{width:auto}.foot{font-size:.82rem;color:#52616b;margin:16px 0}@media(max-width:600px){.wrap{padding:12px}.panel{padding:13px}.rule-row{grid-template-columns:1fr 1fr}.rule-row input:first-child{grid-column:1/-1}}
</style><style id="coldtone-table-readability">@media screen {
.scroll {max-width:100%;overflow-x:auto;margin:20px 0;border:1px solid #BACBD8;border-radius:6px;background:#FCFDFE;scrollbar-color:#71889C #EEF3F9}
table {width:100%;max-width:none;border-collapse:collapse;font-size:1rem;line-height:1.75;min-width:720px}
th,td {padding:14px 16px;border:1px solid #BACBD8;text-align:left;vertical-align:top;word-break:normal;overflow-wrap:anywhere}
th {background:#EEF3F9;color:#173B57;font-weight:700}
td {color:#344552;background:#FCFDFE}
tbody tr:nth-child(even)>td {background:#F4F8FC}
td input,td select {min-width:90px}
td input[type=number] {text-align:right;font-variant-numeric:tabular-nums}
#available {min-width:360px}
#available th,#available td {min-width:90px;white-space:nowrap}
#result table {min-width:880px}
}
@media screen and (max-width:600px){th,td {padding:12px 14px}}

@media screen{.result:has(table),#output:has(table){max-width:100%;overflow-x:auto;white-space:normal}td button{white-space:nowrap;min-width:64px}}
</style>
</head><body><header><h1>CSV 清理與品質檢查</h1><p>作者參考品｜離線單檔｜本機資料不會上傳</p></header><main class="wrap"><div class="notice"><strong>參考工具說明：</strong>此頁由課程作者製作，用來示範提示詞的主要能力和核對資料。它不是 Gemini 生成成果，也不能證明學員或 Gemini 已完成測試。</div><section class="panel"><h2>載入或建立資料</h2><div class="field"><label for="csvFile">載入 CSV</label><input id="csvFile" type="file" accept=".csv,text/csv"><small>選擇 A/B 案例檔。工具首次開啟為空白。</small></div><div class="field" style="margin-top:10px"><label for="csvText">或貼上 CSV 文字</label><textarea id="csvText" rows="4" placeholder="貼上含標題列的 CSV"></textarea></div><div class="buttons"><button id="importText">匯入貼上的 CSV</button></div><div class="field"><label for="headersInput">空白表格欄位（逗號分隔）</label><input id="headersInput" type="text" placeholder="欄位一,欄位二,欄位三"></div><div class="buttons"><button id="createHeaders" class="secondary">建立空白欄位</button><button id="addRow" class="secondary">新增一列</button><button id="clearData" class="danger">清除資料</button></div><div id="message" class="status" aria-live="polite" role="status"></div></section><section class="panel"><h2>清理規則</h2><div class="grid"><div class="field"><label for="keyField">唯一鍵欄</label><select id="keyField" data-map></select></div><div class="field"><label for="requiredFields">必填欄（可多選）</label><select id="requiredFields" data-multi multiple></select></div><div class="field"><label for="numberFields">數字欄（可多選）</label><select id="numberFields" data-multi multiple></select></div></div><div id="numRules"></div><div class="buttons"><button id="checkRows">依目前規則檢查</button><button id="exportGood">匯出有效資料 CSV</button><button id="exportBad" class="secondary">匯出待修正 CSV</button></div></section><section class="panel"><h2>輸入資料表</h2><p class="small">可直接編輯每格；刪除只會移除目前資料列。重新匯入可換 A/B 案例。</p><div id="dataTable" class="scroll"></div></section><section class="panel"><h2>結果與匯出</h2><div id="summary" class="summary"></div><div id="output" class="result" contenteditable="true" aria-live="polite"></div><div class="buttons"><button id="copyOutput" class="secondary">複製結果文字</button><span id="copyStatus" class="small" aria-live="polite"></span></div><div class="buttons" id="exports"></div><p class="foot">所有計算在此 HTML 的瀏覽器分頁內完成，不連接外部服務。輸出需由使用者依案例答案逐項核對。</p></section></main><script>const $=id=>document.getElementById(id);let headers=[],rows=[],sourceRows=[];
function message(text,kind=''){const e=$('message');e.textContent=text;e.className='status '+kind}
function parseCSV(text){text=String(text??'').replace(/^\uFEFF/,'');const records=[];let row=[],cell='',quoted=false,afterQuote=false,fieldStart=true,recordTouched=false;const finish=blank=>{records.push({cells:row,blank});row=[];cell='';afterQuote=false;fieldStart=true;recordTouched=false};for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;afterQuote=true}}else if(c==='\r'){cell+='\n';if(text[i+1]==='\n')i++}else if(c==='\n')cell+='\n';else cell+=c;continue}if(afterQuote){if(c===','){row.push(cell);cell='';afterQuote=false;fieldStart=true;recordTouched=true;continue}if(c==='\r'||c==='\n'){row.push(cell);finish(false);if(c==='\r'&&text[i+1]==='\n')i++;continue}throw new Error(`CSV 第 ${records.length+1} 列：閉合引號後出現額外字元。`)}if(c==='"'){if(!fieldStart)throw new Error(`CSV 第 ${records.length+1} 列：未引用欄位中出現引號。`);quoted=true;fieldStart=false;recordTouched=true;continue}if(c===','){row.push(cell);cell='';fieldStart=true;recordTouched=true;continue}if(c==='\r'||c==='\n'){row.push(cell);const blank=!recordTouched&&row.length===1&&cell==='';finish(blank);if(c==='\r'&&text[i+1]==='\n')i++;continue}cell+=c;fieldStart=false;recordTouched=true}if(quoted)throw new Error(`CSV 第 ${records.length+1} 列：引號未閉合。`);if(afterQuote||recordTouched||row.length||cell!==''){row.push(cell);finish(false)}if(!records.length)return {headers:[],rows:[]};const headers=records.shift().cells.map(v=>v.trim());if(!headers.length||headers.some(h=>!h))throw new Error('CSV 標題列含空白欄名，請先修正。');const rows=records.map((record,i)=>{if(record.blank)return Array(headers.length).fill('');const r=record.cells;if(r.length!==headers.length)throw new Error(`CSV 第 ${i+2} 列有 ${r.length} 欄，標題列有 ${headers.length} 欄；資料未匯入，請修正欄位數。`);return r});return {headers,rows}}
function csvCell(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function saveCSV(name,hs,rs){const text='\uFEFF'+[hs,...rs].map(r=>r.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function setData(h,rs){headers=h;rows=rs.map(r=>[...r]);sourceRows=rs.map(r=>[...r]);fillMaps();renderRows();run()}
$('copyOutput').addEventListener('click',async()=>{const text=$('output').innerText||$('output').textContent||'';try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const range=document.createRange();range.selectNodeContents($('output'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand('copy');sel.removeAllRanges()}$('copyStatus').textContent='已複製目前結果文字。'}catch(e){$('copyStatus').textContent='瀏覽器拒絕複製；可選取文字後手動複製。'}});
function fillMaps(){document.querySelectorAll('[data-map]').forEach(s=>{const old=s.value;s.innerHTML='<option value="">選擇欄位</option>'+headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('');if(headers[Number(old)])s.value=old});document.querySelectorAll('[data-multi]').forEach(s=>{s.innerHTML=headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('')})}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function idx(id){const v=$(id)?.value;return v===''||v==null?-1:Number(v)}function val(row,id){const i=idx(id);return i<0?'':row[i]??''}
function renderRows(){const box=$('dataTable');if(!headers.length){box.innerHTML='<p class="small">目前沒有欄位或資料。可匯入 A/B CSV，或先輸入欄位名稱建立空白表格。</p>';return}let t=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(h=>{let th=document.createElement('th');th.textContent=h;tr.append(th)});let th=document.createElement('th');th.textContent='操作';tr.append(th);thead.append(tr);t.append(thead);let tb=document.createElement('tbody');rows.forEach((r,ri)=>{let tr=document.createElement('tr');headers.forEach((h,ci)=>{let td=document.createElement('td'),input=document.createElement('input');input.type='text';input.value=r[ci]??'';input.dataset.row=ri;input.dataset.col=ci;td.append(input);tr.append(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='刪除';b.className='danger';b.dataset.delete=ri;td.append(b);tr.append(td);tb.append(tr)});t.append(tb);box.replaceChildren(t)}
$('dataTable').addEventListener('input',e=>{if(e.target.dataset.row!==undefined){rows[+e.target.dataset.row][+e.target.dataset.col]=e.target.value;run()}});$('dataTable').addEventListener('click',e=>{if(e.target.dataset.delete!==undefined){rows.splice(+e.target.dataset.delete,1);sourceRows.splice(+e.target.dataset.delete,1);renderRows();run()}});
$('csvFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;setDataFromText(await f.text());e.target.value=''});
function setDataFromText(text){try{const d=parseCSV(text);if(!d.headers.length)throw Error('CSV 沒有標題列或沒有資料。');if(d.headers.some(h=>!h))throw Error('標題列含空白欄名，請先修正。');if(new Set(d.headers).size!==d.headers.length)throw Error('欄名重複，請先修正後重匯入。');setData(d.headers,d.rows);$('headersInput').value=d.headers.join(',');message(`匯入 ${d.rows.length} 列、${d.headers.length} 欄。請確認欄位對應。`,'') }catch(e){message(e.message,'error')}}
$('importText').addEventListener('click',()=>setDataFromText($('csvText').value));$('createHeaders').addEventListener('click',()=>{const h=$('headersInput').value.split(',').map(x=>x.trim());if(!h.length||h.some(x=>!x)||new Set(h).size!==h.length){message('請輸入不重複且非空白的欄位名稱，以逗號分隔。','error');return}setData(h,[]);message('已建立空白欄位。按「新增一列」開始輸入。')});$('addRow').addEventListener('click',()=>{if(!headers.length){message('先匯入 CSV 或建立欄位，再新增資料列。','error');return}const blank=headers.map(()=> '');rows.push(blank);sourceRows.push([...blank]);renderRows();run();message('已新增空白列，請直接編輯欄位。')});$('clearData').addEventListener('click',()=>{setData([],[]);$('csvText').value='';$('headersInput').value='';$('csvFile').value='';message('資料已清除。')});

function selected(id){return Array.from($(id).selectedOptions).map(o=>+o.value)}let checked=[],numSettings={};function renderNumRules(){const box=$('numRules');box.replaceChildren();selected('numberFields').forEach(j=>{if(!numSettings[j])numSettings[j]={decimals:'',negative:false};let row=document.createElement('div');row.className='rule-row';row.innerHTML=`<strong>${esc(headers[j]||'數字欄')}</strong><input type=number min=0 max=10 placeholder=小數位數 value="${esc(numSettings[j].decimals)}" data-nidx="${j}" data-nprop=decimals><label class=checkline><input type=checkbox data-nidx="${j}" data-nprop=negative ${numSettings[j].negative?'checked':''}>允許負值</label>`;box.append(row)})} $('numRules').addEventListener('input',e=>{if(e.target.dataset.nidx!==undefined){const j=+e.target.dataset.nidx;numSettings[j][e.target.dataset.nprop]=e.target.type==='checkbox'?e.target.checked:e.target.value;run()}});$('numRules').addEventListener('change',e=>{if(e.target.dataset.nidx!==undefined){const j=+e.target.dataset.nidx;numSettings[j][e.target.dataset.nprop]=e.target.type==='checkbox'?e.target.checked:e.target.value;run()}});$('numberFields').addEventListener('change',()=>{renderNumRules();run()});
function run(){if(!headers.length||!rows.length){$('summary').innerHTML='';$('output').textContent='載入 CSV 或建立欄位並輸入資料後，結果會顯示在這裡。';checked=[];return}const key=idx('keyField'),req=selected('requiredFields'),nums=selected('numberFields'),seen=new Set();checked=rows.map((r,i)=>{let reasons=[],k=key<0?'':String(r[key]??'').trim();if(key<0)reasons.push('尚未選擇唯一鍵欄');else if(!k)reasons.push(`唯一鍵欄「${headers[key]}」空白`);else if(seen.has(k))reasons.push(`唯一鍵重複：${k}`);else seen.add(k);req.forEach(j=>{if(!String(r[j]??'').trim())reasons.push(`必填欄「${headers[j]}」空白`)});nums.forEach(j=>{let raw=String(r[j]??''),value=raw.trim();if(!value)reasons.push(`數字欄「${headers[j]}」空白`);else if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(value)||!Number.isFinite(Number(value)))reasons.push(`數字欄「${headers[j]}」不是有效數字`);else{const rule=numSettings[j];if(!rule||rule.decimals==='')reasons.push(`數字欄「${headers[j]}」尚未設定規則`);else{const dp=Math.max(0,Math.min(10,+rule.decimals));if(!rule.negative&&Number(value)<0)reasons.push(`數字欄「${headers[j]}」不允許負值`);if((value.split('.')[1]||'').length>dp)reasons.push(`數字欄「${headers[j]}」超過 ${dp} 位小數`)}}});return {i,reasons,status:reasons.length?'待修正':'有效',originalRow:[...(sourceRows[i]||r)],cleanedRow:r.map(v=>String(v??'').trim())}});let good=checked.filter(x=>x.status==='有效'),bad=checked.filter(x=>x.status!=='有效');$('summary').innerHTML=`<span class="pill">輸入 ${rows.length}</span><span class="pill">有效 ${good.length}</span><span class="pill">待修正 ${bad.length}</span><span class="pill">列數核對 ${good.length+bad.length===rows.length?'一致':'不一致'}</span>`;const show=r=>r.map((v,j)=>`${esc(headers[j])}=${esc(v??'')}`).join('｜');$('output').innerHTML='<table><thead><tr><th>列</th><th>狀態</th><th>拒絕原因</th><th>匯入原值</th><th>目前整理值（去首尾空白）</th></tr></thead><tbody>'+checked.map(x=>`<tr><td>${x.i+1}</td><td>${x.status}</td><td>${esc(x.reasons.join('；')||'—')}</td><td>${show(x.originalRow)}</td><td>${show(x.cleanedRow)}</td></tr>`).join('')+'</tbody></table>'}
$('checkRows').addEventListener('click',run);['keyField','requiredFields'].forEach(id=>$(id).addEventListener('change',run));$('exportGood').addEventListener('click',()=>{run();let ids=checked.filter(x=>x.status==='有效').map(x=>x.i);if(!headers.length){message('沒有資料可匯出。','error');return}saveCSV('clean-valid.csv',headers,ids.map(i=>checked[i].cleanedRow));message(`已匯出 ${ids.length} 列有效資料。`)});$('exportBad').addEventListener('click',()=>{run();if(!headers.length){message('沒有資料可匯出。','error');return}let hs=[...headers,'檢查狀態','拒絕原因'],rs=checked.filter(x=>x.status!=='有效').map(x=>[...rows[x.i],x.status,x.reasons.join('；')]);saveCSV('clean-review.csv',hs,rs);message(`已匯出 ${rs.length} 列待修正資料。`)});
</script></body></html>
