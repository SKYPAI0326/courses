<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品 ABC 累積分類｜作者參考工具</title><style>

white-space:pre-wrap;background:#f7fafb;border:1px solid #dce5e8;border-radius:8px;padding:12px;min-height:60px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.small{font-size:.86rem;color:#53616a}.rule-row{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr)) auto;gap:6px;margin:7px 0}.svgbox{width:100%;overflow:auto}.svgbox svg{display:block;max-width:100%;height:auto}.checkline{display:flex;align-items:center;gap:8px;padding:7px 0}.checkline input{width:auto}.foot{font-size:.82rem;color:#52616b;margin:16px 0}@media(max-width:600px){.wrap{padding:12px}.panel{padding:13px}.rule-row{grid-template-columns:1fr 1fr}.rule-row input:first-child{grid-column:1/-1}}

</head><body><header><h1>商品 ABC 累積分類</h1><p>作者參考品｜離線單檔｜本機資料不會上傳</p></header><main class="wrap"><div class="notice"><strong>參考工具說明：</strong>此頁由課程作者製作，用來示範提示詞的主要能力和核對資料。它不是 Gemini 生成成果，也不能證明學員或 Gemini 已完成測試。</div><section class="panel"><h2>載入或建立資料</h2><div class="field"><label for="csvFile">載入 CSV</label><input id="csvFile" type="file" accept=".csv,text/csv"><small>選擇 A/B 案例檔。工具首次開啟為空白。</small></div><div class="field" style="margin-top:10px"><label for="csvText">或貼上 CSV 文字</label><textarea id="csvText" rows="4" placeholder="貼上含標題列的 CSV"></textarea></div><div class="buttons"><button id="importText">匯入貼上的 CSV</button></div><div class="field"><label for="headersInput">空白表格欄位（逗號分隔）</label><input id="headersInput" type="text" placeholder="欄位一,欄位二,欄位三"></div><div class="buttons"><button id="createHeaders" class="secondary">建立空白欄位</button><button id="addRow" class="secondary">新增一列</button><button id="clearData" class="danger">清除資料</button></div><div id="message" class="status" aria-live="polite" role="status"></div></section><section class="panel"><h2>欄位與分類設定</h2><div class="grid"><div class="field"><label for="idField">商品識別碼</label><select id="idField" data-map></select></div><div class="field"><label for="nameField">商品名稱</label><select id="nameField" data-map></select></div><div class="field"><label for="salesField">彙總金額</label><select id="salesField" data-map></select></div><div class="field"><label for="sortDirection">排序方向</label><select id="sortDirection"><option value="desc" selected>金額由高到低</option><option value="asc">金額由低到高</option></select></div></div><div id="ruleList" class="grid"></div><div class="buttons"><button id="addClass" class="secondary">新增一類</button><button id="removeClass" class="secondary">移除最後一類</button></div><div class="buttons"><button id="calculate">計算分類</button><button id="exportResult">匯出含分類 CSV</button></div><div id="chart" class="svgbox"></div></section><section class="panel"><h2>輸入資料表</h2><p class="small">可直接編輯每格；刪除只會移除目前資料列。重新匯入可換 A/B 案例。</p><div id="dataTable" class="scroll"></div></section><section class="panel"><h2>結果與匯出</h2><div id="summary" class="summary"></div><div id="output" class="result" contenteditable="true" aria-live="polite"></div><div class="buttons"><button id="copyOutput" class="secondary">複製結果文字</button><span id="copyStatus" class="small" aria-live="polite"></span></div><div class="buttons" id="exports"></div><p class="foot">所有計算在此 HTML 的瀏覽器分頁內完成，不連接外部服務。輸出需由使用者依案例答案逐項核對。</p></section></main><script>const $=id=>document.getElementById(id);let headers=[],rows=[];
function message(text,kind=''){const e=$('message');e.textContent=text;e.className='status '+kind}
function parseCSV(text){text=String(text??'').replace(/^\uFEFF/,'');const records=[];let row=[],cell='',quoted=false,afterQuote=false,fieldStart=true,recordTouched=false;const finish=blank=>{records.push({cells:row,blank});row=[];cell='';afterQuote=false;fieldStart=true;recordTouched=false};for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;afterQuote=true}}else if(c==='\r'){cell+='\n';if(text[i+1]==='\n')i++}else if(c==='\n')cell+='\n';else cell+=c;continue}if(afterQuote){if(c===','){row.push(cell);cell='';afterQuote=false;fieldStart=true;recordTouched=true;continue}if(c==='\r'||c==='\n'){row.push(cell);finish(false);if(c==='\r'&&text[i+1]==='\n')i++;continue}throw new Error(`CSV 第 ${records.length+1} 列：閉合引號後出現額外字元。`)}if(c==='"'){if(!fieldStart)throw new Error(`CSV 第 ${records.length+1} 列：未引用欄位中出現引號。`);quoted=true;fieldStart=false;recordTouched=true;continue}if(c===','){row.push(cell);cell='';fieldStart=true;recordTouched=true;continue}if(c==='\r'||c==='\n'){row.push(cell);const blank=!recordTouched&&row.length===1&&cell==='';finish(blank);if(c==='\r'&&text[i+1]==='\n')i++;continue}cell+=c;fieldStart=false;recordTouched=true}if(quoted)throw new Error(`CSV 第 ${records.length+1} 列：引號未閉合。`);if(afterQuote||recordTouched||row.length||cell!==''){row.push(cell);finish(false)}if(!records.length)return {headers:[],rows:[]};const headers=records.shift().cells.map(v=>v.trim());if(!headers.length||headers.some(h=>!h))throw new Error('CSV 標題列含空白欄名，請先修正。');const rows=records.map((record,i)=>{if(record.blank)return Array(headers.length).fill('');const r=record.cells;if(r.length!==headers.length)throw new Error(`CSV 第 ${i+2} 列有 ${r.length} 欄，標題列有 ${headers.length} 欄；資料未匯入，請修正欄位數。`);return r});return {headers,rows}}
function csvCell(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function saveCSV(name,hs,rs){const text='\uFEFF'+[hs,...rs].map(r=>r.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function setData(h,rs){headers=h;rows=rs;fillMaps();renderRows();run()}
$('copyOutput').addEventListener('click',async()=>{const text=$('output').innerText||$('output').textContent||'';try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const range=document.createRange();range.selectNodeContents($('output'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand('copy');sel.removeAllRanges()}$('copyStatus').textContent='已複製目前結果文字。'}catch(e){$('copyStatus').textContent='瀏覽器拒絕複製；可選取文字後手動複製。'}});
function fillMaps(){document.querySelectorAll('[data-map]').forEach(s=>{const old=s.value;s.innerHTML='<option value="">選擇欄位</option>'+headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('');if(headers[Number(old)])s.value=old});document.querySelectorAll('[data-multi]').forEach(s=>{s.innerHTML=headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('')})}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function idx(id){const v=$(id)?.value;return v===''||v==null?-1:Number(v)}function val(row,id){const i=idx(id);return i<0?'':row[i]??''}
function renderRows(){const box=$('dataTable');if(!headers.length){box.innerHTML='<p class="small">目前沒有欄位或資料。可匯入 A/B CSV，或先輸入欄位名稱建立空白表格。</p>';return}let t=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(h=>{let th=document.createElement('th');th.textContent=h;tr.append(th)});let th=document.createElement('th');th.textContent='操作';tr.append(th);thead.append(tr);t.append(thead);let tb=document.createElement('tbody');rows.forEach((r,ri)=>{let tr=document.createElement('tr');headers.forEach((h,ci)=>{let td=document.createElement('td'),input=document.createElement('input');input.type='text';input.value=r[ci]??'';input.dataset.row=ri;input.dataset.col=ci;td.append(input);tr.append(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='刪除';b.className='danger';b.dataset.delete=ri;td.append(b);tr.append(td);tb.append(tr)});t.append(tb);box.replaceChildren(t)}
$('dataTable').addEventListener('input',e=>{if(e.target.dataset.row!==undefined){rows[+e.target.dataset.row][+e.target.dataset.col]=e.target.value;run()}});$('dataTable').addEventListener('click',e=>{if(e.target.dataset.delete!==undefined){rows.splice(+e.target.dataset.delete,1);renderRows();run()}});
$('csvFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;setDataFromText(await f.text());e.target.value=''});
function setDataFromText(text){try{const d=parseCSV(text);if(!d.headers.length)throw Error('CSV 沒有標題列或沒有資料。');if(d.headers.some(h=>!h))throw Error('標題列含空白欄名，請先修正。');if(new Set(d.headers).size!==d.headers.length)throw Error('欄名重複，請先修正後重匯入。');setData(d.headers,d.rows);$('headersInput').value=d.headers.join(',');message(`匯入 ${d.rows.length} 列、${d.headers.length} 欄。請確認欄位對應。`,'') }catch(e){message(e.message,'error')}}
$('importText').addEventListener('click',()=>setDataFromText($('csvText').value));$('createHeaders').addEventListener('click',()=>{const h=$('headersInput').value.split(',').map(x=>x.trim());if(!h.length||h.some(x=>!x)||new Set(h).size!==h.length){message('請輸入不重複且非空白的欄位名稱，以逗號分隔。','error');return}setData(h,[]);message('已建立空白欄位。按「新增一列」開始輸入。')});$('addRow').addEventListener('click',()=>{if(!headers.length){message('先匯入 CSV 或建立欄位，再新增資料列。','error');return}rows.push(headers.map(()=>''));renderRows();run();message('已新增空白列，請直接編輯欄位。')});$('clearData').addEventListener('click',()=>{setData([],[]);$('csvText').value='';$('headersInput').value='';$('csvFile').value='';message('資料已清除。')});

let classifications=[],categoryCount=3,classificationReady=false,ruleNames=['','',''],ruleLimits=['',''];function renderRules(){const box=$('ruleList');box.replaceChildren();for(let n=1;n<=categoryCount;n++){const name=document.createElement('div');name.className='field';name.innerHTML=`<label for=class${n}>第 ${n} 類名稱${n===categoryCount?'（最後一類）':''}</label><input id=class${n} type=text placeholder=類別名稱 value="${esc(ruleNames[n-1]||'')}">`;box.append(name);if(n<categoryCount){const limit=document.createElement('div');limit.className='field';limit.innerHTML=`<label for=limit${n}>第 ${n} 類累積上界</label><input id=limit${n} type=number min=0 max=100 placeholder=累積百分比 value="${esc(ruleLimits[n-1]||'')}">`;box.append(limit)}}}renderRules();$('ruleList').addEventListener('input',e=>{const m=e.target.id.match(/^(class|limit)(\d+)$/);if(m){const i=Number(m[2])-1;(m[1]==='class'?ruleNames:ruleLimits)[i]=e.target.value;run()}});$('addClass').addEventListener('click',()=>{categoryCount++;ruleNames.push('');ruleLimits.push('');renderRules();run()});$('removeClass').addEventListener('click',()=>{if(categoryCount>3){categoryCount--;ruleNames.length=categoryCount;ruleLimits.length=categoryCount-1;renderRules();run()}});function getRules(){return {names:Array.from({length:categoryCount},(_,i)=>$(`class${i+1}`).value.trim()),bounds:Array.from({length:categoryCount-1},(_,i)=>$(`limit${i+1}`).value)}}function run(){classificationReady=false;if(!rows.length){$('summary').innerHTML='';$('output').textContent='匯入商品資料並選擇欄位、類別名稱及累積界線。';$('chart').innerHTML='';classifications=[];return}const ii=idx('idField'),ni=idx('nameField'),si=idx('salesField'),{names,bounds}=getRules(),direction=$('sortDirection').value;let errors=[];if([ii,ni,si].some(x=>x<0))errors.push('請選擇識別碼、名稱和金額欄');if(names.length<3||names.some(x=>!x))errors.push('至少需要三個非空白類別名稱與兩條累積界線');if(new Set(names).size!==names.length)errors.push('類別名稱不可重複');let limits=bounds.map(Number);if(bounds.some(x=>x==='')||limits.some(x=>!Number.isFinite(x)||x<0||x>100))errors.push('每個非末類都要設定 0 至 100 的累積上界');if(limits.some((x,i)=>i>0&&x<=limits[i-1]))errors.push('累積上界必須依序嚴格增加');if(errors.length){$('summary').innerHTML='';$('output').textContent='設定未完成：'+errors.join('；')+'。未產生分類匯出。';classifications=[];$('chart').innerHTML='';return}classificationReady=true;const classify=cum=>{const j=limits.findIndex(bound=>cum<=bound);return names[j<0?names.length-1:j]};let seen=new Set(),items=rows.map((r,i)=>{let id=String(r[ii]??'').trim(),raw=String(r[si]??'').trim(),amt=Number(raw),reason=[];if(!id)reason.push('識別碼空白');else if(seen.has(id))reason.push('識別碼重複');else seen.add(id);if(!raw||! /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)||!Number.isFinite(amt))reason.push('金額不是有效十進位數字');else if(amt<0)reason.push('負額待確認');return {i,id,name:r[ni],amt,reason}});let usable=items.filter(x=>!x.reason.length),total=usable.reduce((a,x)=>a+x.amt,0);if(total===0){$('summary').innerHTML=`<span class="pill">待確認 ${items.length}</span>`;$('output').textContent='可納入計算的總額為 0，無法計算占比或分類。負額、重複識別碼或無效金額仍保留待確認。';classifications=items.map(x=>({...x,status:'待確認',share:null,cum:null,reason:[...x.reason,'可計算總額為 0，無法分類']}));$('chart').innerHTML='';return}usable.sort((a,b)=>(direction==='asc'?a.amt-b.amt:b.amt-a.amt)||String(a.id).localeCompare(String(b.id)));let cum=0;const byIndex={};usable.forEach(x=>{cum+=x.amt;x.share=x.amt/total*100;x.cum=cum/total*100;x.status=classify(x.cum);byIndex[x.i]=x});classifications=items.map(x=>byIndex[x.i]||({...x,status:'待確認',share:null,cum:null}));let counts={};classifications.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('summary').innerHTML=`<span class="pill">暫時計算總額 ${total}</span><span class="pill">筆數 ${rows.length}</span>`+Object.entries(counts).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('');$('output').innerHTML='<table><thead><tr><th>商品</th><th>金額</th><th>個別占比</th><th>加入後累積</th><th>分類／原因</th></tr></thead><tbody>'+classifications.map(x=>`<tr><td>${esc(x.name||'')}</td><td>${esc(rows[x.i][si])}</td><td>${x.share===null?'—':x.share.toFixed(2)+'%'}</td><td>${x.cum===null?'—':x.cum.toFixed(2)+'%'}</td><td>${esc(x.status+(x.reason.length?'：'+x.reason.join('；'):''))}</td></tr>`).join('')+'</tbody></table>';let W=620,H=Math.max(130,45+usable.length*28),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','商品累積占比橫條圖');const palette=['#16877b','#d29b34','#557a91','#8a6bb5','#c45b6b','#6f8d3e','#478a99','#b07742'];const mk=(tag,attrs,text)=>{let e=document.createElementNS(svg.namespaceURI,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;svg.append(e)};mk('line',{x1:160,y1:20,x2:160,y2:H-10,stroke:'#9aaeb8'});usable.forEach((x,i)=>{let y=28+i*28,j=names.indexOf(x.status);mk('text',{x:4,y:y+13,'font-size':12,fill:'#17212b'},String(x.name||x.id));mk('rect',{x:160,y,width:Math.max(2,400*x.cum/100),height:17,fill:palette[j%palette.length]});mk('text',{x:168+400*x.cum/100,y:y+13,'font-size':11,fill:'#17212b'},x.cum.toFixed(1)+'%')});$('chart').replaceChildren(svg)}
$('calculate').addEventListener('click',run);['idField','nameField','salesField','sortDirection'].forEach(id=>$(id).addEventListener('input',run));$('exportResult').addEventListener('click',()=>{run();if(!classificationReady){message('分類設定未完成，請先修正欄位、類別與累積界線。','error');return}const extra=classifications.map(x=>[x.status,x.share===null?'':x.share.toFixed(4),x.cum===null?'':x.cum.toFixed(4),x.reason.join('；')]);saveCSV('product-cumulative-classification.csv',[...headers,'分類','個別占比百分比','累積占比百分比','待確認原因'],rows.map((r,i)=>[...r,...(extra[i]||['待計算','','',''])]));message('已匯出全部商品列及目前分類狀態。')});
</script></body></html>
