<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>請款資料初檢｜作者參考工具</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#2c2b28;font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.8}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:1.5rem}h2{font-size:1.15rem}label{display:block}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #d8d4cb;border-radius:4px;max-width:100%}input,select,textarea{width:100%;background:#fff;color:#2c2b28}button{cursor:pointer;background:#fff;margin:4px}button:disabled{opacity:.5;cursor:default}a{color:#5a7a5a}table{width:100%;border-collapse:collapse;min-width:620px}td,th{padding:8px;border-bottom:1px solid #d8d4cb;text-align:left}th{font-weight:600}td input{min-width:65px}.scroll{overflow:auto;max-width:100%}.note{color:#6e6b66}.error{color:#a05030;white-space:pre-wrap}.summary{padding:16px;background:#fff;margin:16px 0;white-space:pre-wrap}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2c2b28;outline-offset:2px}@media(max-width:500px){main{padding:16px}h1{font-size:1.3rem}}@media print{.actions,.import-box,button,.note{display:none}main{max-width:none;padding:0}input,select{border:0;padding:0}.scroll{overflow:visible}table{min-width:0;font-size:10pt}h1{font-size:16pt}}</style></head><body><main><h1>請款資料初檢</h1><p>作者提供的離線參考品，初次資料空白。規則由使用者設定，只列資料缺漏，不代替人工核准。</p><label>可選類別（逗號分隔）<input id="categories"></label><label>需資產標籤的類別（逗號分隔）<input id="asset-categories"></label><label>主管確認門檻（元）<input id="threshold" type="number" min="0"></label><button id="apply">套用類別</button><label>項目名稱<input id="name"></label><label>費用類別<select id="category"><option value="">請先設定類別</option></select></label><label>金額（元）<input id="amount" type="number"></label><label><input id="receipt" type="checkbox" style="width:auto">已有憑證</label><label><input id="approved" type="checkbox" style="width:auto">已有主管確認</label><label>資產標籤<input id="asset"></label><button id="check">檢查</button><button id="clear">清除當次輸入</button><pre id="result" role="status" aria-live="polite"></pre><p><a href="../../chapters/CH2.html#calculation-vs-rules">回第二章</a></p></main><script>
const el=id=>document.getElementById(id),split=v=>v.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
function inspect(d){if(d.amount===''||!Number.isFinite(Number(d.amount))||Number(d.amount)<=0)return ['金額需為大於 0 的數字'];if(!d.name.trim())return ['請輸入項目名稱'];if(!d.category)return ['請先選擇費用類別'];if(d.threshold===''||!Number.isFinite(Number(d.threshold))||Number(d.threshold)<0)return ['請設定非負主管確認門檻'];const a=[];if(!d.receipt)a.push('需補憑證');if(d.assetCategories.includes(d.category)&&!d.asset.trim())a.push('需補資產標籤');if(Number(d.amount)>=Number(d.threshold)&&!d.approved)a.push('需主管確認');return a.length?a:['資料欄位完整，仍待人工核對']}
el('apply').onclick=()=>{const old=el('category').value,cats=split(el('categories').value);if(!cats.length||new Set(cats).size!==cats.length){el('result').textContent='類別不得空白或重複';return}el('category').replaceChildren(new Option('請選擇',''),...cats.map(x=>new Option(x,x)));if(cats.includes(old))el('category').value=old;el('result').textContent='類別已更新，請重新檢查'};
el('check').onclick=()=>{const cats=split(el('categories').value),assetCategories=split(el('asset-categories').value);if(assetCategories.some(x=>!cats.includes(x))){el('result').textContent='需資產標籤的類別必須存在於類別清單';return}el('result').textContent=inspect({name:el('name').value,category:el('category').value,amount:el('amount').value,threshold:el('threshold').value,receipt:el('receipt').checked,approved:el('approved').checked,asset:el('asset').value,assetCategories}).join('\n')};
el('clear').onclick=()=>{for(const id of ['name','amount','asset'])el(id).value='';el('category').value='';el('receipt').checked=el('approved').checked=false;el('result').textContent='已清除當次輸入，規則設定保留'};document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',()=>el('result').textContent='輸入已改變，請重新檢查'));
</script></body></html>
