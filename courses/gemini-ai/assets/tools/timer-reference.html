<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="會議倒數計時器：離線參考成品與查核素材"><title>會議倒數計時器｜課程參考工具</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#2c2b28;font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.8}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:1.5rem}h2{font-size:1.15rem}label{display:block}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #d8d4cb;border-radius:4px;max-width:100%}input,select,textarea{width:100%;background:#fff;color:#2c2b28}button{cursor:pointer;background:#fff;margin:4px}button:disabled{opacity:.5;cursor:default}a{color:#5a7a5a}table{width:100%;border-collapse:collapse;min-width:620px}td,th{padding:8px;border-bottom:1px solid #d8d4cb;text-align:left}th{font-weight:600}td input{min-width:65px}.scroll{overflow:auto;max-width:100%}.note{color:#6e6b66}.error{color:#a05030;white-space:pre-wrap}.summary{padding:16px;background:#fff;margin:16px 0;white-space:pre-wrap}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2c2b28;outline-offset:2px}@media(max-width:500px){main{padding:16px}h1{font-size:1.3rem}}@media print{.actions,.import-box,button,.note{display:none}main{max-width:none;padding:0}input,select{border:0;padding:0}.scroll{overflow:visible}table{min-width:0;font-size:10pt}h1{font-size:16pt}}</style></head><body><a href="#main">跳至主要內容</a><main id="main"><h1>會議倒數計時器</h1><p class="note">暖身參考品。生成後應能在本機使用，不需要呼叫 AI。</p><label>會議主題<input id="topic" value="活動籌備"></label><label>秒數<input id="seconds" type="number" min="1" step="1" value="10"></label><div id="display" class="summary" role="status">10</div><div class="actions"><button id="start">開始</button><button id="pause">暫停</button><button id="reset">重設</button></div><p id="error" class="error" role="status"></p></main><script>const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvText(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function safeCell(v){const t=String(v??'');return /^[=+@-]/.test(t)?"'"+t:t}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;text=text.replace(/^\ufeff/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(!quoted&&cell!=='')throw Error('引號格式錯誤');else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('引號未結束');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}
function number(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)&&n>=0?n:null}
function money(v){const n=number(v);return n!==null&&Math.abs(n*100-Math.round(n*100))<0.00001?n:null}
function announce(t){$('error').textContent=t}

let left=10,tick=null;function paint(){$('display').textContent=$('topic').value+'：'+left+' 秒'+(left===0?'（時間到）':'')}function stop(){clearInterval(tick);tick=null}$('start').onclick=()=>{const n=number($('seconds').value);if(n===null||n<1||!Number.isInteger(n)){announce('請輸入正整數秒數');return}announce('');if(tick)return;if(left===0)left=n;tick=setInterval(()=>{left--;paint();if(left===0)stop()},1000)};$('pause').onclick=stop;$('reset').onclick=()=>{stop();const n=number($('seconds').value);if(n===null||n<1||!Number.isInteger(n)){announce('請輸入正整數秒數');return}left=n;announce('');paint()};$('seconds').oninput=()=>{stop();const n=number($('seconds').value);if(n!==null&&Number.isInteger(n)&&n>0){left=n;paint()}else announce('請輸入正整數秒數')};$('topic').oninput=paint;paint();</script></body></html>
