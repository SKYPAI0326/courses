<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虛構報價工具與核准門檻</title><style>body{max-width:760px;margin:2rem auto;padding:1rem;font:1.05rem/1.7 system-ui,sans-serif;color:#203238;background:#f7faf9}main{background:white;border:1px solid #cad8d8;border-radius:8px;padding:1.25rem}label{display:block;margin:.7rem 0}input,select,button{font:inherit;padding:.5rem}output{display:block;white-space:pre-line;margin-top:1rem;padding:.8rem;background:#eef5f4}</style></head><body><main><h1>虛構報價工具</h1><p>依教學規則計算；核准上限另作判斷，不代表真實報價政策。</p>
<form id="form"><label>月費<select name="fee"><option value="30000">基礎 30,000</option><option value="60000">進階 60,000</option><option value="100000">客製 100,000</option></select></label><label>月數<select name="months"><option>3</option><option>6</option><option>12</option></select></label><label>折扣（%）<input name="discount" type="number" min="0" max="30" step="0.1" value="0"></label><label>付款方式<select name="payment"><option value="month">月付</option><option value="quarter">季付</option><option value="year">年付</option></select></label><label><input name="tax" type="checkbox" checked>含示範稅5%</label><label>核准上限（可留空）<input name="ceiling" type="number" min="0" placeholder="例如 300000"></label><button>計算</button><button id="clear" type="button">清除結果</button></form><output id="result" role="status" aria-live="polite">尚未計算</output></main>
<script>
const form=document.querySelector('#form'),out=document.querySelector('#result');form.addEventListener('input',()=>out.textContent='條件已變更；請重新計算。');document.querySelector('#clear').onclick=()=>out.textContent='尚未計算';form.onsubmit=e=>{e.preventDefault();out.textContent='';const x=Object.fromEntries(new FormData(form));try{const fee=Number(x.fee),months=Number(x.months),discount=Number(x.discount);if(!Number.isFinite(fee)||fee<=0)throw Error('月費須大於0');if(![3,6,12].includes(months))throw Error('期間須為3、6或12月');if(!Number.isFinite(discount)||discount<0||discount>30)throw Error('折扣須為0–30%');if(!['month','quarter','year'].includes(x.payment))throw Error('請選有效付款方式');if(x.payment==='year'&&months!==12)throw Error('年付限定12個月');const net=Math.round(fee*months*(1-discount/100)*(x.payment==='year'?.97:1)),total=Math.round(net*(form.elements.tax.checked?1.05:1)),n=x.payment==='month'?months:x.payment==='quarter'?months/3:1;const each=Math.floor(total/n),parts=Array(n).fill(each);parts[n-1]+=total-each*n;let text=`稅前：NT$${net.toLocaleString()}
總額：NT$${total.toLocaleString()}
各期：${parts.map(v=>'NT$'+v.toLocaleString()).join('、')}`;if(x.ceiling!==''){const cap=Number(x.ceiling);if(!Number.isFinite(cap)||cap<0)throw Error('核准上限須為非負數');const delta=total-cap;text+='\n核准檢查：'+(delta>0?'超出上限 NT$'+delta.toLocaleString()+'，停止承諾並待核准':'在核准上限內；仍須依組織流程確認')};out.textContent=text}catch(err){out.textContent=err.message}};
</script></body></html>
