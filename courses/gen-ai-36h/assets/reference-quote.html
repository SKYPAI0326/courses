<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虛構報價工具</title><style>body{max-width:780px;margin:auto;padding:24px;color:#26383b;background:#fafafa;font:17px/1.8 system-ui}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:8px}button{margin:8px}output{display:block;white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd6d8;padding:8px}.scroll{overflow-x:auto}svg{max-width:100%;height:auto}input{max-width:100%;box-sizing:border-box}</style></head><body><h1>虛構報價工具</h1><p>虛構教學參考成品；可作恢復點，仍需實際測試。</p><form id="quote"><label>月費<select name="fee"><option value="30000">基礎30000</option><option value="60000">進階60000</option><option value="100000">客製100000</option></select></label><label>月數<select name="months"><option>3</option><option>6</option><option>12</option></select></label><label>折扣%<input name="discount" type="number" min="0" max="30" step="0.1" value="0" required></label><label>付款<select name="payment"><option value="month">月付</option><option value="quarter">季付</option><option value="year">年付</option></select></label><label><input name="tax" type="checkbox" checked>含示範稅5%</label><button>計算</button></form><output id="result" aria-live="polite"></output><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.Gen36=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const cardFields=['name','when','input','output','check','recovery','location'];
const showFields=['name','task','user','input','output','check','recovery','status','url','tools'];
function number(value,label){if(value===''||value===null||value===undefined||!Number.isFinite(Number(value)))throw Error(label+'請填有效數字');return Number(value);}
function quote(x){const fee=number(x.fee,'月費'),months=number(x.months,'月數'),discount=number(x.discount,'折扣');if(fee<=0)throw Error('月費必須大於 0');if(![3,6,12].includes(months))throw Error('期間請選 3、6 或 12 月');if(discount<0||discount>30)throw Error('折扣限 0–30%');if(!['month','quarter','year'].includes(x.payment))throw Error('請選付款方式');if(x.payment==='year'&&months!==12)throw Error('年付限定十二個月');const raw=fee*months*(1-discount/100)*(x.payment==='year'?.97:1);const net=Math.round(raw),total=Math.round(raw*(x.tax?1.05:1));const n=x.payment==='month'?months:x.payment==='quarter'?months/3:1;const each=Math.floor(total/n);const installments=Array(n).fill(each);installments[n-1]+=total-each*n;return{net,total,installments,discountPercent:Math.round((1-(1-discount/100)*(x.payment==='year'?.97:1))*10000)/100};}
function stats(rows){if(!Array.isArray(rows)||!rows.length)throw Error('資料不可為空');const seen=new Set();const r=rows.map(x=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(x.month)||seen.has(x.month))throw Error('月份格式錯誤或重複');seen.add(x.month);const revenue=number(x.revenue,'營收'),orders=number(x.orders,'訂單');if(revenue<0||orders<0||!Number.isInteger(orders))throw Error('營收及訂單不可負值，訂單須整數');return{month:x.month,revenue,orders};}).sort((a,b)=>a.month.localeCompare(b.month));const map=new Map(r.map(x=>[x.month,x]));const total=r.reduce((s,x)=>s+x.revenue,0),orders=r.reduce((s,x)=>s+x.orders,0);const yoy=r.filter(x=>r.length<=12||x.month>=r[12].month).map(x=>{const prior=map.get((Number(x.month.slice(0,4))-1)+x.month.slice(4));return{month:x.month,percent:prior&&prior.revenue!==0?(x.revenue/prior.revenue-1)*100:null};});return{total,orders,average:orders?total/orders:null,yoy,rows:r};}
function key(x){return[x.submitted_at,x.email.trim().toLowerCase(),x.subject.trim()].join('|');}
function route(x,seen){const required=['submitted_at','name','email','subject','message','category','summary','next_action','review_status'];if(required.some(k=>typeof x[k]!=='string'||!x[k].trim())||!/^\S+@\S+\.\S+$/.test(x.email)||x.review_status!=='已覆核'||!['inquiry','complaint','partnership','other'].includes(x.category))return{status:'blocked',reason:'未覆核或欄位無效'};if(seen.includes(key(x)))return{status:'duplicate',key:key(x)};return{status:'ready',key:key(x),route:{inquiry:'業務',complaint:'客服',partnership:'合作',other:'待處理'}[x.category],draft:['inquiry','partnership'].includes(x.category)};}
function clean(obj,fields){if(!obj||typeof obj!=='object'||Array.isArray(obj)||fields.some(k=>typeof obj[k]!=='string'||obj[k].length>12000))throw Error('欄位格式錯誤');const out={};for(const k of fields)out[k]=obj[k];return out;}
function validate(kind,data){if(kind==='toolbox'){if(!Array.isArray(data)||data.length>30)throw Error('工具卡數量錯誤');return data.map(x=>clean(x,cardFields));}if(kind==='showcase')return clean(data,showFields);throw Error('未知資料類型');}
function exportData(kind,data){return JSON.stringify({version:1,kind,data:validate(kind,data)},null,2);}
function importData(text,kind){if(typeof text!=='string'||text.length>1000000)throw Error('檔案過大');const x=JSON.parse(text);if(x.version!==1||x.kind!==kind)throw Error('版本或資料類型不符');return{version:1,kind,data:validate(kind,x.data)};}
function save(storage,key,value){try{storage.setItem(key,value);if(storage.getItem(key)!==value)throw Error('保存未完成');return{ok:true};}catch(e){return{ok:false,error:String(e.message||e)};}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(x){try{const u=new URL(x);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function showcase(x){const labels={name:'作品名稱',task:'解決的任務',user:'使用者',input:'輸入',output:'完成物',check:'驗證證據',recovery:'失敗時如何恢復',status:'狀態與成效',tools:'實際使用工具'};const rows=Object.entries(labels).map(([k,label])=>'<section><h2>'+label+'</h2><p>'+esc(x[k]).replace(/\n/g,'<br>')+'</p></section>').join('');const u=safeUrl(x.url);return'<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(x.name||'個人作品')+'</title><style>body{max-width:780px;margin:40px auto;padding:24px;font-family:system-ui;line-height:1.8;color:#26383b;background:#fafafa}h2{font-size:1.1rem;color:#446c73}p{overflow-wrap:anywhere}section{border-bottom:1px solid #ccd6d8;padding:12px 0}@media print{body{margin:0}}</style><h1>'+esc(x.name||'個人作品')+'</h1>'+rows+(u?'<p><a href="'+esc(u)+'" rel="noopener noreferrer">開啟個人成果</a></p>':'<p>尚未提供可開啟的成果網址。</p>')+'</html>';}
return{quote,stats,key,route,exportData,importData,save,esc,safeUrl,showcase,cardFields,showFields};
});
</script><script>const f=document.getElementById('quote'),out=document.getElementById('result');f.addEventListener('input',()=>out.textContent='條件已變更，請重新計算');f.onsubmit=e=>{e.preventDefault();out.textContent='';try{const x=Object.fromEntries(new FormData(f));x.tax=f.elements.tax.checked;const q=Gen36.quote(x);out.textContent='稅前：'+q.net+'\n總額：'+q.total+'\n合計折扣：'+q.discountPercent+'%\n各期：'+q.installments.join('、')}catch(e){out.textContent=e.message}};</script></body></html>
