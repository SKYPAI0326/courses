<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月資料與原始交易檢查工具</title><style>body{max-width:820px;margin:2rem auto;padding:1rem;font:1.02rem/1.7 system-ui,sans-serif;color:#203238;background:#f7faf9}main{background:white;border:1px solid #cad8d8;border-radius:8px;padding:1.25rem}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{border:1px solid #cad8d8;padding:.5rem;text-align:left}output{display:block;white-space:pre-line;padding:.8rem;background:#eef5f4}svg{width:100%;max-height:330px}</style></head><body><main><h1>月資料與原始交易檢查</h1><p>支援既有月資料及新的交易明細。原始列的排除／待查規則以資料字典為準。</p><label>選擇CSV<input id="file" type="file" accept=".csv,text/csv"></label><output id="status" role="status" aria-live="polite">尚未載入</output><div id="chart"></div><div class="scroll"><table id="table"></table></div><p id="notes"></p></main>
<script>
const file=document.querySelector('#file'),status=document.querySelector('#status'),table=document.querySelector('#table'),chart=document.querySelector('#chart'),notes=document.querySelector('#notes');
function cell(row,v){const td=row.insertCell();td.textContent=String(v);return td}
function drawBars(items){chart.replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 720 ${Math.max(160,items.length*42+30)}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','各區域淨營收長條圖');const max=Math.max(...items.map(x=>x.amount),1);items.forEach((x,i)=>{const y=16+i*42,bar=document.createElementNS(ns,'rect'),label=document.createElementNS(ns,'text');bar.setAttribute('x','115');bar.setAttribute('y',String(y));bar.setAttribute('height','25');bar.setAttribute('width',String(Math.max(1,x.amount/max*480)));bar.setAttribute('fill','#39757d');label.setAttribute('x','8');label.setAttribute('y',String(y+18));label.textContent=x.region;svg.append(bar,label)});chart.append(svg)}
function render(rows,headers){table.replaceChildren();const h=table.insertRow();headers.forEach(x=>{const th=document.createElement('th');th.textContent=x;h.append(th)});rows.forEach(values=>{const tr=table.insertRow();values.forEach(v=>cell(tr,v))})}
function drawTrend(items){chart.replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 720 260');svg.setAttribute('role','img');svg.setAttribute('aria-label','月營收趨勢，精確數值見下表');const values=items.map(x=>x.revenue),min=Math.min(...values),max=Math.max(...values),range=max-min||1;const line=document.createElementNS(ns,'polyline');line.setAttribute('points',items.map((x,i)=>(20+i*680/Math.max(items.length-1,1))+','+(220-(x.revenue-min)/range*180)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#39757d');line.setAttribute('stroke-width','3');svg.append(line);for(const i of [0,items.length-1]){const label=document.createElementNS(ns,'text');label.setAttribute('x',String(20+i*680/Math.max(items.length-1,1)));label.setAttribute('y','250');label.textContent=items[i].month;svg.append(label)}chart.append(svg)}
file.onchange=async()=>{chart.replaceChildren();table.replaceChildren();notes.textContent='';try{const f=file.files[0];if(!f)return;if(f.size>1000000)throw Error('CSV超過1MB');const text=(await f.text()).replace(/^﻿/,'').trim();const [header,...lines]=text.split(/\r?\n/);const rows=lines.map((line,i)=>{const parts=line.split(',');if(parts.length!==header.split(',').length)throw Error(`第${i+2}列欄位數錯誤`);return parts});if(!rows.length)throw Error('CSV至少要有一筆資料');
if(header==='month,revenue,orders'){const seen=new Set(),data=rows.map((r,i)=>{const [month,rev,ord]=r;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||seen.has(month))throw Error(`第${i+2}列月份錯誤或重複`);seen.add(month);const revenue=Number(rev),orders=Number(ord);if(!Number.isFinite(revenue)||revenue<0||!Number.isInteger(orders)||orders<0)throw Error(`第${i+2}列數字錯誤`);return{month,revenue,orders}}).sort((a,b)=>a.month.localeCompare(b.month));const map=new Map(data.map(x=>[x.month,x])),total=data.reduce((s,x)=>s+x.revenue,0),orders=data.reduce((s,x)=>s+x.orders,0);const out=data.map(x=>{const prev=map.get(`${Number(x.month.slice(0,4))-1}${x.month.slice(4)}`),yoy=prev&&prev.revenue!==0?((x.revenue/prev.revenue-1)*100).toFixed(2)+'%':'缺前一年資料';return[x.month,x.revenue,x.orders,yoy]});render(out,['月份','營收','訂單','年增率']);drawTrend(data);status.textContent=`月資料 ${data.length} 列；總營收 ${total.toLocaleString()}；總訂單 ${orders.toLocaleString()}；加權客單價 ${orders?(total/orders).toFixed(2):'無法計算'}`;notes.textContent='圖表趨勢只描述數值；本資料不含促銷或成因欄位。';return}
if(header!=='transaction_id,date,region,amount,status')throw Error('欄位須為月資料或 transaction_id,date,region,amount,status');const seen=new Set(),totals=new Map(),sourceIDs=new Map();let duplicate=0,missing=0,cancelled=0,refund=0,kept=0;for(let i=0;i<rows.length;i++){const [id,date,region,amountText,state]=rows[i],line=i+2;if(seen.has(id)){duplicate++;continue}seen.add(id);if(!id||!region)throw Error(`第${line}列缺ID或區域`);if(!date){missing++;continue}if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error(`第${line}列日期格式錯誤`);const [year,month,day]=date.split('-').map(Number),parsed=new Date(Date.UTC(year,month-1,day));if(parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day)throw Error(`第${line}列日期不存在`);const amount=Number(amountText);if(!Number.isFinite(amount))throw Error(`第${line}列金額無效`);if(state==='CANCELLED'){cancelled++;continue}if(state==='REFUND'){if(amount>0)throw Error(`第${line}列退款應為負數`);refund++}else if(state==='SALE'){if(amount<0)throw Error(`第${line}列銷售不可為負數`)}else throw Error(`第${line}列狀態無效`);kept++;totals.set(region,(totals.get(region)||0)+amount);if(!sourceIDs.has(region))sourceIDs.set(region,[]);sourceIDs.get(region).push(id)}const items=[...totals].map(([region,amount])=>({region,amount})).sort((a,b)=>a.region.localeCompare(b.region));render(items.map(x=>[x.region,sourceIDs.get(x.region).length,x.amount,sourceIDs.get(x.region).join(', ')]),['區域','有效筆數','淨額','來源ID']);drawBars(items);const sum=items.reduce((s,x)=>s+x.amount,0);status.textContent=`有效交易 ${kept} 列；區域淨額合計 NT$${sum.toLocaleString()}`;notes.textContent=`清理紀錄：重複ID排除 ${duplicate} 列；缺日期待查 ${missing} 列；取消排除 ${cancelled} 列；退款保留負值 ${refund} 列。待查／取消／重複不計入本次合計。`;
}catch(e){status.textContent='無法完成：'+e.message;chart.replaceChildren();table.replaceChildren()}};
</script></body></html>
