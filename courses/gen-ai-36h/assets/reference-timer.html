<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可調工作／休息計時器</title><style>
body{max-width:720px;margin:2rem auto;padding:1rem;font:1.05rem/1.7 system-ui,sans-serif;color:#203238;background:#f7faf9}main{background:white;border:1px solid #cad8d8;border-radius:8px;padding:1.25rem}label{display:block;margin:.8rem 0}input,select,button{font:inherit;padding:.55rem;border:1px solid #8aa1a4;border-radius:6px}button{margin:.35rem;cursor:pointer}.clock{font-size:clamp(3rem,12vw,5.5rem);font-variant-numeric:tabular-nums;margin:.2rem 0}#state{min-height:1.8em;color:#285b63}small{color:#50666a}</style></head>
<body><main><h1>工作／休息計時器</h1><p>完整單檔示範。保存到本機後重新開啟並自行測試。</p>
<label>工作時間（分鐘）<input id="work" type="number" min="1" max="180" value="25"></label>
<label>休息時間（分鐘）<input id="rest" type="number" min="1" max="180" value="5"></label>
<label>目前階段<select id="phase"><option value="work">工作</option><option value="rest">休息</option></select></label>
<div id="clock" class="clock" aria-label="剩餘時間">25:00</div><button id="start" type="button">開始</button><button id="pause" type="button">暫停</button><button id="reset" type="button">重設</button><p id="state" role="status" aria-live="polite">已停止</p><small>範圍：每個時間 1–180 分鐘。計時到零會停止，不會自動開始下一階段。</small></main>
<script>
const work=document.querySelector('#work'),rest=document.querySelector('#rest'),phase=document.querySelector('#phase'),clock=document.querySelector('#clock'),state=document.querySelector('#state');let remaining=1500000,deadline=null,loop=null;
function selected(){const input=phase.value==='work'?work:rest;const n=Number(input.value);if(input.value===''||!Number.isInteger(n)||n<1||n>180)throw Error('目前階段時間須為1至180分鐘的整數');return n*60000}
function show(){const sec=Math.ceil(remaining/1000);clock.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function stop(){if(deadline!==null)remaining=Math.max(0,deadline-performance.now());deadline=null;clearInterval(loop);loop=null;show()}
function tick(){remaining=Math.max(0,deadline-performance.now());show();if(remaining===0){stop();state.textContent=phase.value==='work'?'工作時間到':'休息時間到'}}
function reset(){stop();try{remaining=selected();state.textContent='已重設；尚未開始'}catch(e){remaining=0;state.textContent=e.message}show()}
phase.addEventListener('change',reset);work.addEventListener('change',reset);rest.addEventListener('change',reset);
document.querySelector('#start').onclick=()=>{try{if(deadline!==null)return;if(remaining<=0)remaining=selected();if(!remaining)throw Error('請先設定有效時間');deadline=performance.now()+remaining;loop=setInterval(tick,100);state.textContent=phase.value==='work'?'工作倒數中':'休息倒數中'}catch(e){state.textContent=e.message}};
document.querySelector('#pause').onclick=()=>{stop();state.textContent='已暫停'};document.querySelector('#reset').onclick=reset;show();
</script></body></html>
