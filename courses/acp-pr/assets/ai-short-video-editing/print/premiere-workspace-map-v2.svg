<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Premiere 工作區概念位置圖</title>
  <desc id="desc">以抽象區塊顯示 Project、Source Monitor、Program Monitor、Timeline、Properties、Text、Effects 與 Export 的關係。</desc>
  <rect width="1920" height="1080" fill="#f5f3ee"/>
  <text x="90" y="90" font-family="PingFang TC, sans-serif" font-size="50" font-weight="700" fill="#36565b">Premiere 工作區概念位置圖</text>
  <text x="90" y="140" font-family="PingFang TC, sans-serif" font-size="26" fill="#5c6d70">概念定位，不是教室版介面截圖；實際位置以 Premiere Pro 2024 Windows 教室畫面為準。</text>

  <g font-family="PingFang TC, sans-serif">
    <rect x="90" y="190" width="390" height="330" rx="20" fill="#ffffff" stroke="#7a9ea3" stroke-width="5"/>
    <text x="125" y="245" font-size="34" font-weight="700" fill="#36565b">Project</text>
    <text x="125" y="290" font-size="25" fill="#44575b">素材、bin、sequence item</text>
    <text x="125" y="330" font-size="25" fill="#44575b">媒體連結與 Usage</text>
    <rect x="125" y="375" width="320" height="32" rx="7" fill="#dbe7e6"/>
    <rect x="125" y="425" width="270" height="32" rx="7" fill="#e8eeed"/>
    <rect x="125" y="475" width="300" height="22" rx="6" fill="#eff3f2"/>

    <rect x="510" y="190" width="570" height="330" rx="20" fill="#ffffff" stroke="#7a9ea3" stroke-width="5"/>
    <text x="545" y="245" font-size="34" font-weight="700" fill="#36565b">Source Monitor</text>
    <text x="545" y="290" font-size="25" fill="#44575b">看原始素材、設定 In／Out</text>
    <rect x="545" y="325" width="500" height="140" rx="12" fill="#263238"/>
    <circle cx="795" cy="395" r="42" fill="#7a9ea3"/>
    <polygon points="782,372 782,418 820,395" fill="#ffffff"/>

    <rect x="1110" y="190" width="720" height="330" rx="20" fill="#ffffff" stroke="#7a9ea3" stroke-width="5"/>
    <text x="1145" y="245" font-size="34" font-weight="700" fill="#36565b">Program Monitor</text>
    <text x="1145" y="290" font-size="25" fill="#44575b">看目前 sequence 的播放結果</text>
    <rect x="1145" y="325" width="650" height="140" rx="12" fill="#263238"/>
    <rect x="1390" y="350" width="160" height="90" rx="10" fill="#7a9ea3"/>

    <rect x="90" y="560" width="1320" height="410" rx="20" fill="#ffffff" stroke="#7a9ea3" stroke-width="5"/>
    <text x="125" y="620" font-size="34" font-weight="700" fill="#36565b">Timeline</text>
    <text x="125" y="665" font-size="25" fill="#44575b">sequence、播放頭、video／audio tracks、timeline clips</text>
    <line x1="220" y1="705" x2="220" y2="920" stroke="#d85f4a" stroke-width="6"/>
    <text x="125" y="735" font-size="23" fill="#5c6d70">V2</text>
    <rect x="260" y="705" width="310" height="55" rx="8" fill="#a9c5c8"/>
    <rect x="590" y="705" width="420" height="55" rx="8" fill="#c7d9db"/>
    <text x="125" y="820" font-size="23" fill="#5c6d70">V1</text>
    <rect x="160" y="790" width="420" height="55" rx="8" fill="#7a9ea3"/>
    <rect x="600" y="790" width="520" height="55" rx="8" fill="#95b3b7"/>
    <text x="125" y="905" font-size="23" fill="#5c6d70">A1</text>
    <rect x="160" y="875" width="960" height="55" rx="8" fill="#d9bd8f"/>

    <rect x="1440" y="560" width="390" height="410" rx="20" fill="#ffffff" stroke="#7a9ea3" stroke-width="5"/>
    <text x="1475" y="620" font-size="34" font-weight="700" fill="#36565b">找功能的側邊面板</text>
    <rect x="1475" y="665" width="320" height="60" rx="10" fill="#dbe7e6"/>
    <text x="1500" y="705" font-size="25" fill="#36565b">Properties／Effect Controls</text>
    <rect x="1475" y="745" width="150" height="60" rx="10" fill="#e8eeed"/>
    <text x="1520" y="785" font-size="25" fill="#36565b">Text</text>
    <rect x="1645" y="745" width="150" height="60" rx="10" fill="#e8eeed"/>
    <text x="1682" y="785" font-size="25" fill="#36565b">Effects</text>
    <rect x="1475" y="825" width="320" height="105" rx="10" fill="#36565b"/>
    <text x="1570" y="888" font-size="31" font-weight="700" fill="#ffffff">Export</text>
  </g>
</svg>
