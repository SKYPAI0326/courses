<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">生圖、轉線稿、線稿反控三段工作流</title>
  <desc id="desc">工作流由起、承、轉合三段組成：brief 生成完稿，完稿反推線稿，再以線稿與新 brief 產生新完稿、變體與系列。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c9b58f"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="#2c2b28"/>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <text x="800" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="#e8e4dc">三段工作流總圖</text>

    <g transform="translate(90 135)">
      <rect width="400" height="560" rx="26" fill="#363531" stroke="#777268" stroke-width="3"/>
      <text x="200" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#e8e4dc">起</text>
      <text x="200" y="102" text-anchor="middle" font-size="22" fill="#bdb7aa">M2 生圖｜2h</text>
      <rect x="70" y="170" width="260" height="86" rx="18" fill="#45433e" stroke="#9b9488" stroke-width="2"/>
      <text x="200" y="224" text-anchor="middle" font-size="27" fill="#e8e4dc">brief</text>
      <path d="M200 274V338" stroke="#c9b58f" stroke-width="6" marker-end="url(#arrow)"/>
      <rect x="70" y="368" width="260" height="100" rx="18" fill="#4b493f" stroke="#c9b58f" stroke-width="3"/>
      <text x="200" y="430" text-anchor="middle" font-size="29" font-weight="700" fill="#f3ead7">完稿</text>
    </g>

    <path d="M510 415H570" stroke="#c9b58f" stroke-width="7" marker-end="url(#arrow)"/>

    <g transform="translate(600 135)">
      <rect width="400" height="560" rx="26" fill="#363531" stroke="#777268" stroke-width="3"/>
      <text x="200" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#e8e4dc">承</text>
      <text x="200" y="102" text-anchor="middle" font-size="22" fill="#bdb7aa">M3 線稿反推｜2h</text>
      <rect x="70" y="170" width="260" height="86" rx="18" fill="#45433e" stroke="#9b9488" stroke-width="2"/>
      <text x="200" y="224" text-anchor="middle" font-size="27" fill="#e8e4dc">完稿</text>
      <path d="M200 274V338" stroke="#c9b58f" stroke-width="6" marker-end="url(#arrow)"/>
      <rect x="70" y="368" width="260" height="100" rx="18" fill="#4b493f" stroke="#c9b58f" stroke-width="3"/>
      <text x="200" y="414" text-anchor="middle" font-size="29" font-weight="700" fill="#f3ead7">線稿</text>
      <text x="200" y="450" text-anchor="middle" font-size="20" fill="#bdb7aa">骨架</text>
    </g>

    <path d="M1020 415H1080" stroke="#c9b58f" stroke-width="7" marker-end="url(#arrow)"/>

    <g transform="translate(1110 135)">
      <rect width="400" height="560" rx="26" fill="#363531" stroke="#777268" stroke-width="3"/>
      <text x="200" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#e8e4dc">轉／合</text>
      <text x="200" y="102" text-anchor="middle" font-size="22" fill="#bdb7aa">M4 + M5｜2.5h + 0.5h</text>
      <rect x="52" y="158" width="296" height="112" rx="18" fill="#45433e" stroke="#9b9488" stroke-width="2"/>
      <text x="200" y="204" text-anchor="middle" font-size="25" fill="#e8e4dc">線稿 + 新 brief</text>
      <text x="200" y="239" text-anchor="middle" font-size="19" fill="#bdb7aa">換主題，不重做骨架</text>
      <path d="M200 290V350" stroke="#c9b58f" stroke-width="6" marker-end="url(#arrow)"/>
      <rect x="52" y="380" width="296" height="116" rx="18" fill="#4b493f" stroke="#c9b58f" stroke-width="3"/>
      <text x="200" y="429" text-anchor="middle" font-size="29" font-weight="700" fill="#f3ead7">新完稿</text>
      <text x="200" y="466" text-anchor="middle" font-size="20" fill="#bdb7aa">新變體／新系列</text>
    </g>

    <rect x="145" y="748" width="1310" height="92" rx="20" fill="#34332f" stroke="#5e5a53" stroke-width="2"/>
    <text x="800" y="790" text-anchor="middle" font-size="23" fill="#e8e4dc">每一段的產出 = 下一段的素材</text>
    <text x="800" y="824" text-anchor="middle" font-size="21" fill="#bdb7aa">每次跑完 = 累積一個可重用的骨架 + 品牌 DNA</text>
  </g>
</svg>
