  <path d="M600 605v70" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round"/><path d="m575 655 25 28 25-28" fill="none" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
