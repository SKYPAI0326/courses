<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">上下對調構圖變體</title><desc id="desc">商品位於畫面上方約六成，文字與行動區位於下方約四成。</desc>
  <rect width="1200" height="900" fill="#f5f3ee"/><rect x="70" y="70" width="1060" height="760" rx="30" fill="#fff" stroke="#d8d4cb" stroke-width="4"/>
  <g font-family="'Noto Sans TC',sans-serif"><text x="110" y="140" font-size="38" font-weight="700" fill="#2c2b28">B｜上下對調</text><text x="110" y="185" font-size="23" fill="#7a766d">商品上 60%，文字下 40%；視線由上往下。</text></g>
  <rect x="150" y="235" width="900" height="365" rx="28" fill="#eef3ed" stroke="#5a7a5a" stroke-width="4"/>
