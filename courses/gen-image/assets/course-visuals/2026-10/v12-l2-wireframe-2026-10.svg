<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">L2 視覺化線稿骨架</title>
  <desc id="desc">商品置於右側，標題區在左上，徽章與行動區在左下，並標示留白與視覺動線。</desc>
  <rect width="1600" height="1000" fill="#f5f3ee"/>
  <rect x="85" y="85" width="1430" height="830" rx="32" fill="#ffffff" stroke="#d8d4cb" stroke-width="4"/>
  <g font-family="'Noto Sans TC',sans-serif" fill="#2c2b28">
    <text x="130" y="155" font-size="42" font-weight="700">L2 視覺化線稿｜商品右 × 文字左</text>
    <text x="130" y="205" font-size="24" fill="#7a766d">只有位置、比例與動線；不帶材質、色彩或成品風格。</text>
  </g>
  <g fill="none" stroke="#6f6b64" stroke-width="5">
    <rect x="140" y="280" width="560" height="190" rx="18" stroke-dasharray="16 13"/>
    <rect x="140" y="535" width="210" height="150" rx="75" stroke-dasharray="14 12"/>
    <rect x="140" y="735" width="470" height="88" rx="44"/>
    <path d="M920 315h330l95 110v340H825V425z"/>
    <path d="M920 315v110h425"/>
    <circle cx="1085" cy="545" r="88"/>
    <path d="M980 680q105-75 210 0v85H980z"/>
  </g>
  <g font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#5f5a52">
    <text x="420" y="385" text-anchor="middle">主標題／副標留白區</text>
    <text x="245" y="625" text-anchor="middle">徽章</text>
    <text x="375" y="792" text-anchor="middle">CTA 安全區</text>
    <text x="1085" y="865" text-anchor="middle">商品主體 55–65%</text>
  </g>
  <path d="M430 510C600 610 690 615 850 555" fill="none" stroke="#8a6a4a" stroke-width="8" stroke-linecap="round"/>
  <path d="m820 530 43 21-39 28" fill="none" stroke="#8a6a4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="650" font-family="'Noto Sans TC',sans-serif" font-size="24" fill="#8a6a4a">視線：訊息 → 商品</text>
</svg>
