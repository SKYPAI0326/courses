<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">不對稱留白構圖變體</title><desc id="desc">商品偏右下三分之一，左上保留大量標題空間，形成雜誌編輯感。</desc>
  <rect width="1200" height="900" fill="#f5f3ee"/><rect x="70" y="70" width="1060" height="760" rx="30" fill="#fff" stroke="#d8d4cb" stroke-width="4"/>
  <g font-family="'Noto Sans TC',sans-serif"><text x="110" y="140" font-size="38" font-weight="700" fill="#2c2b28">D｜不對稱留白</text><text x="110" y="185" font-size="23" fill="#7a766d">商品偏右下，主標只留一行；讓留白成為構圖的一部分。</text></g>
  <rect x="130" y="255" width="520" height="150" rx="18" fill="none" stroke="#8a6a4a" stroke-width="5" stroke-dasharray="14 12"/>
  <rect x="130" y="470" width="280" height="75" rx="38" fill="none" stroke="#8a6a4a" stroke-width="5"/>
  <circle cx="850" cy="565" r="165" fill="#eef3ed" stroke="#5a7a5a" stroke-width="5"/><circle cx="850" cy="525" r="85" fill="#d7e2d4" stroke="#5a7a5a" stroke-width="4"/><rect x="775" y="615" width="150" height="54" rx="27" fill="#5a7a5a"/>
  <path d="M500 350C630 380 735 460 800 520" fill="none" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round"/><path d="m766 508 45 23-16-48" fill="none" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
