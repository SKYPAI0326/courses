<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">需求、執行、驗收、迭代四步循環</title>
  <desc id="desc">每張廣告都依需求、AI 執行、人工驗收與迭代四步前進，四列分別呈現完稿、線稿、新主題完稿與品牌系列的工作。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c9b58f"/></marker>
  </defs>
  <rect width="1800" height="1180" rx="34" fill="#2c2b28"/>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif">
    <text x="900" y="76" text-anchor="middle" font-size="34" font-weight="700" fill="#e8e4dc">每張廣告的 4 步循環</text>

    <g font-size="27" font-weight="700" fill="#e8e4dc" text-anchor="middle">
      <text x="255" y="150">需求</text><text x="675" y="150">執行</text><text x="1105" y="150">驗收</text><text x="1535" y="150">迭代</text>
    </g>
    <g font-size="20" fill="#bdb7aa" text-anchor="middle">
      <text x="255" y="184">PM 你</text><text x="675" y="184">AI 它</text><text x="1105" y="184">PM 你</text><text x="1535" y="184">PM 你</text>
    </g>

    <g fill="#383733" stroke="#706c64" stroke-width="2">
      <rect x="80" y="225" width="350" height="128" rx="20"/><rect x="500" y="225" width="350" height="128" rx="20"/><rect x="930" y="225" width="350" height="128" rx="20"/><rect x="1360" y="225" width="350" height="128" rx="20"/>
      <rect x="80" y="397" width="350" height="128" rx="20"/><rect x="500" y="397" width="350" height="128" rx="20"/><rect x="930" y="397" width="350" height="128" rx="20"/><rect x="1360" y="397" width="350" height="128" rx="20"/>
      <rect x="80" y="569" width="350" height="128" rx="20"/><rect x="500" y="569" width="350" height="128" rx="20"/><rect x="930" y="569" width="350" height="128" rx="20"/><rect x="1360" y="569" width="350" height="128" rx="20"/>
      <rect x="80" y="741" width="350" height="128" rx="20"/><rect x="500" y="741" width="350" height="128" rx="20"/><rect x="930" y="741" width="350" height="128" rx="20"/><rect x="1360" y="741" width="350" height="128" rx="20"/>
    </g>

    <g stroke="#c9b58f" stroke-width="5" marker-end="url(#arrow)">
      <path d="M445 289H480"/><path d="M865 289H910"/><path d="M1295 289H1340"/>
      <path d="M445 461H480"/><path d="M865 461H910"/><path d="M1295 461H1340"/>
      <path d="M445 633H480"/><path d="M865 633H910"/><path d="M1295 633H1340"/>
      <path d="M445 805H480"/><path d="M865 805H910"/><path d="M1295 805H1340"/>
    </g>

    <g font-size="22" fill="#e8e4dc" text-anchor="middle">
      <text x="255" y="282">brief 六件套</text><text x="675" y="282">完稿 A</text><text x="1105" y="276">驗收 A</text><text x="1105" y="310" font-size="18" fill="#bdb7aa">8 項清單</text><text x="1535" y="282">保留 X + 修 Y</text>
      <text x="255" y="454">同 brief</text><text x="675" y="454">線稿</text><text x="1105" y="448">驗收 B</text><text x="1105" y="482" font-size="18" fill="#bdb7aa">6 項清單</text><text x="1535" y="454">迭代或重跑</text>
      <text x="255" y="626">線稿 + 新主題</text><text x="675" y="626">新完稿 B／C</text><text x="1105" y="626">驗收 A</text><text x="1535" y="626">迭代</text>
      <text x="255" y="798">線稿 + 全套 DNA</text><text x="675" y="798">3 張系列</text><text x="1105" y="792">驗收 C</text><text x="1105" y="826" font-size="18" fill="#bdb7aa">5 項清單</text><text x="1535" y="798">迭代</text>
    </g>

    <g transform="translate(80 930)">
      <rect width="1630" height="170" rx="22" fill="#34332f" stroke="#5e5a53" stroke-width="2"/>
      <g font-size="20" fill="#bdb7aa" text-anchor="middle"><text x="270" y="42">你的角色</text><text x="815" y="42">AI 的工作</text><text x="1360" y="42">你的判斷</text></g>
      <g font-size="24" fill="#e8e4dc" text-anchor="middle"><text x="270" y="82">需求判定者／系列把關者</text><text x="815" y="82">執行設計師</text><text x="1360" y="82">骨架驗收者／系列把關者</text></g>
      <text x="815" y="132" text-anchor="middle" font-size="21" fill="#c9b58f">M2 起｜生圖　→　M3 承｜轉線稿　→　M4 轉／合｜反控</text>
    </g>
  </g>
</svg>
