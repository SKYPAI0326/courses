<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">左右對調構圖變體</title><desc id="desc">商品在左側，文字與行動區在右側，視線由右上導向左下。</desc>
  <rect width="1200" height="900" fill="#f5f3ee"/><rect x="70" y="70" width="1060" height="760" rx="30" fill="#fff" stroke="#d8d4cb" stroke-width="4"/>
  <g font-family="'Noto Sans TC',sans-serif"><text x="110" y="140" font-size="38" font-weight="700" fill="#2c2b28">A｜左右對調</text><text x="110" y="185" font-size="23" fill="#7a766d">商品左，文字右；只改位置，不改資訊優先序。</text></g>
  <rect x="125" y="255" width="455" height="455" rx="26" fill="#eef3ed" stroke="#5a7a5a" stroke-width="4"/>
  <circle cx="352" cy="455" r="125" fill="#d7e2d4" stroke="#5a7a5a" stroke-width="4"/><rect x="255" y="565" width="194" height="64" rx="30" fill="#5a7a5a"/>
  <g fill="none" stroke="#8a6a4a" stroke-width="5"><rect x="660" y="265" width="390" height="150" rx="18" stroke-dasharray="14 12"/><rect x="660" y="470" width="260" height="78" rx="39"/><rect x="660" y="610" width="330" height="84" rx="42"/></g>
  <path d="M960 245C885 360 735 505 540 625" fill="none" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round"/><path d="m556 591-38 48 60 4" fill="none" stroke="#6b7fa3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
