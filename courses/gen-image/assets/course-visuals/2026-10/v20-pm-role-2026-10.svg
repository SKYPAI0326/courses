<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI 需求方的三個責任與四步流程</title>
  <desc id="desc">需求方負責釐清需求、人工驗收與維持系列一致，工作依序為 brief、生成、驗收與局部修正。</desc>
  <rect width="1600" height="1000" fill="#f5f3ee"/>
  <rect x="70" y="70" width="1460" height="860" rx="36" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
  <text x="120" y="160" font-family="'Noto Sans TC',sans-serif" font-size="54" font-weight="700" fill="#2c2b28">你是 AI 的需求方</text>
  <text x="120" y="215" font-family="'Noto Sans TC',sans-serif" font-size="26" fill="#7a766d">主導需求與把關，讓每次生成留下可重做的證據</text>

  <g font-family="'Noto Sans TC',sans-serif">
    <rect x="120" y="285" width="410" height="210" rx="26" fill="#f5ede2" stroke="#8a6a4a" stroke-width="3"/>
    <circle cx="185" cy="350" r="30" fill="#8a6a4a"/>
    <text x="185" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">1</text>
    <text x="235" y="360" font-size="34" font-weight="700" fill="#2c2b28">講清楚需求</text>
    <text x="165" y="420" font-size="25" fill="#5f5a52">對象、目的、內容、限制</text>
    <text x="165" y="458" font-size="25" fill="#5f5a52">都要能被第三人重述</text>

    <rect x="595" y="285" width="410" height="210" rx="26" fill="#eef3ed" stroke="#5a7a5a" stroke-width="3"/>
    <circle cx="660" cy="350" r="30" fill="#5a7a5a"/>
    <text x="660" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">2</text>
    <text x="710" y="360" font-size="34" font-weight="700" fill="#2c2b28">人工驗收</text>
    <text x="640" y="420" font-size="25" fill="#5f5a52">AI 只列待查線索</text>
    <text x="640" y="458" font-size="25" fill="#5f5a52">人用清單與工具決定</text>

    <rect x="1070" y="285" width="410" height="210" rx="26" fill="#eef1f6" stroke="#6b7fa3" stroke-width="3"/>
    <circle cx="1135" cy="350" r="30" fill="#6b7fa3"/>
    <text x="1135" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">3</text>
    <text x="1185" y="360" font-size="34" font-weight="700" fill="#2c2b28">維持系列一致</text>
    <text x="1115" y="420" font-size="25" fill="#5f5a52">記錄骨架、色票與禁用</text>
    <text x="1115" y="458" font-size="25" fill="#5f5a52">新圖仍要像同一品牌</text>

    <text x="120" y="600" font-size="24" font-weight="700" letter-spacing="3" fill="#7a766d">四步工作流</text>
    <g font-size="29" font-weight="700" text-anchor="middle">
      <rect x="120" y="650" width="270" height="120" rx="22" fill="#2c2b28"/>
      <text x="255" y="700" fill="#ffffff">01  BRIEF</text><text x="255" y="742" font-size="23" font-weight="400" fill="#edeae3">把六件套填完整</text>
      <path d="M410 710h70" stroke="#8a6a4a" stroke-width="7" stroke-linecap="round"/><path d="m465 693 22 17-22 17" fill="none" stroke="#8a6a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="505" y="650" width="270" height="120" rx="22" fill="#8a6a4a"/>
      <text x="640" y="700" fill="#ffffff">02  生成</text><text x="640" y="742" font-size="23" font-weight="400" fill="#f5ede2">取得候選，不急著放行</text>
      <path d="M795 710h70" stroke="#5a7a5a" stroke-width="7" stroke-linecap="round"/><path d="m850 693 22 17-22 17" fill="none" stroke="#5a7a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="890" y="650" width="270" height="120" rx="22" fill="#5a7a5a"/>
      <text x="1025" y="700" fill="#ffffff">03  驗收</text><text x="1025" y="742" font-size="23" font-weight="400" fill="#eef3ed">用證據逐項核對</text>
      <path d="M1180 710h70" stroke="#6b7fa3" stroke-width="7" stroke-linecap="round"/><path d="m1235 693 22 17-22 17" fill="none" stroke="#6b7fa3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1275" y="650" width="205" height="120" rx="22" fill="#6b7fa3"/>
      <text x="1378" y="700" fill="#ffffff">04  局部修正</text><text x="1378" y="742" font-size="23" font-weight="400" fill="#eef1f6">只改失敗項</text>
    </g>
    <rect x="120" y="840" width="1360" height="2" fill="#e8e4da"/>
    <text x="120" y="885" font-size="24" fill="#7a766d">通過條件：必要項全過，並保留 prompt、reference、人工修改與發布證據。</text>
  </g>
</svg>
