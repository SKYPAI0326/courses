<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">brief 六件套</title>
  <desc id="desc">商業生圖 brief 由業種、商品、客群、訴求、必要元素與風格 preset 六項組成。</desc>
  <rect width="1600" height="1000" fill="#f5f3ee"/>
  <text x="110" y="145" font-family="'Noto Sans TC',sans-serif" font-size="58" font-weight="700" fill="#2c2b28">brief 六件套</text>
  <text x="110" y="205" font-family="'Noto Sans TC',sans-serif" font-size="27" fill="#7a766d">缺一項，模型就多猜一項；先把需求變成可核對的欄位。</text>
  <g font-family="'Noto Sans TC',sans-serif">
    <g transform="translate(110 285)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#8a6a4a"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">1</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">業種</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">你在哪個市場競爭？</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">例：咖啡店、保健、旅遊</text>
    </g>
    <g transform="translate(585 285)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#5a7a5a"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">2</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">商品</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">畫面主角究竟是什麼？</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">名稱、外觀、材質、規格</text>
    </g>
    <g transform="translate(1060 285)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#6b7fa3"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">3</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">客群</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">誰要在三秒內看懂？</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">情境、需求、閱讀距離</text>
    </g>
    <g transform="translate(110 585)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#c9963a"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">4</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">訴求</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">看完後要記得什麼？</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">單一主張、優先順序、CTA</text>
    </g>
    <g transform="translate(585 585)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#b5703a"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">5</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">必要元素</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">少了哪一項就不能交？</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">商品、徽章、安全區、留白</text>
    </g>
    <g transform="translate(1060 585)">
      <rect width="430" height="250" rx="28" fill="#ffffff" stroke="#d8d4cb" stroke-width="3"/>
      <circle cx="72" cy="72" r="34" fill="#7a9ea3"/><text x="72" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">6</text>
      <text x="130" y="82" font-size="37" font-weight="700" fill="#2c2b28">風格 preset</text>
      <text x="50" y="150" font-size="26" fill="#5f5a52">用屬性描述，不靠品牌名。</text>
      <text x="50" y="197" font-size="23" fill="#7a766d">色彩、字感、光線、材質</text>
    </g>
    <text x="110" y="925" font-size="25" fill="#7a766d">完成後，第三人應能只看 brief 重述同一個交付目標。</text>
  </g>
</svg>
