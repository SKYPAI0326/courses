<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=1">
<title>島嶼果日茶果禮盒商業海報完稿</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#f7f0df}
body{font-family:"PingFang TC","Noto Sans TC",sans-serif;color:#2f342b}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel{position:absolute;inset:0 auto 0 0;width:655px;background:rgba(247,240,223,.96)}
.brand{position:absolute;left:82px;top:72px;display:flex;align-items:center;gap:24px}
.brand-mark{width:62px;height:62px}
.brand-zh{font-size:27px;font-weight:700;letter-spacing:5px;line-height:1.2}
.brand-en{margin-top:7px;color:#6c705f;font-size:15px;letter-spacing:4px}
.eyebrow{position:absolute;left:84px;top:286px;color:#7f624d;font-size:20px;font-weight:500;letter-spacing:4px}
.title{position:absolute;left:82px;top:352px;font-size:58px;font-weight:700;line-height:1.34;letter-spacing:-1px}
.rule{position:absolute;left:84px;top:543px;width:92px;height:3px;background:#c96b37}
.desc{position:absolute;left:84px;top:588px;color:#55594d;font-size:23px;line-height:1.65}
.cta{position:absolute;left:84px;top:724px;width:232px;height:64px;border-radius:5px;background:#5f6f4a;color:#fffaf0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:2px}
.note{position:absolute;left:84px;top:816px;color:#7c7c70;font-size:16px;letter-spacing:1.5px}
.structure{position:absolute;left:82px;top:1142px;width:348px;height:92px;border:1px solid #cfc4ad;border-radius:5px;background:#f4ead7;padding:19px 24px}
.structure strong{display:block;color:#5f6f4a;font-size:17px;margin-bottom:7px}
.structure span{color:#6a6c62;font-size:15px}
</style>
</head>
<body>
<main class="poster">
  <img class="photo" src="island-day-product-anchor.png" alt="">
  <div class="panel"></div>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 70 70" aria-hidden="true">
      <circle cx="28" cy="28" r="20" fill="#c96b37"/>
      <path d="M12 54c26-3 43-16 51-40-27 9-44 22-51 40Z" fill="#5f6f4a"/>
    </svg>
    <div><div class="brand-zh">島嶼果日</div><div class="brand-en">ISLAND DAY</div></div>
  </div>
  <div class="eyebrow">炙香鳳梨 × 高山烏龍</div>
  <div class="title">把島嶼的甜<br>留給慢下來的午後</div>
  <div class="rule"></div>
  <div class="desc">鳳梨果片與烏龍茶的午後搭配<br>適合日常分享，也適合好好送禮</div>
  <div class="cta">探索茶果禮盒</div>
  <div class="note">原創課程示範品牌｜正式文字於 Canva 完稿</div>
  <div class="structure"><strong>社群主視覺 4:5</strong><span>P1 商品　P2 主標　P3 CTA</span></div>
</main>
</body>
</html>
